<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="triGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55" />
      <stop offset="100%" stop-color="#FFB323" />
    </linearGradient>
    
    <!-- Shadow gradient -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#D98A00" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Triangle body (Rounded corners) -->
  <path 
    d="M 60 15 
       L 105 95 
       C 108 100, 105 105, 100 105 
       L 20 105 
       C 15 105, 12 100, 15 95 
       L 60 15 
       Z" 
    fill="url(#triGrad)" 
    filter="url(#shadow)" 
    stroke="#D98A00" 
    stroke-width="5" 
    stroke-linejoin="round" 
  />

  <!-- Main highlight (top to bottom left) -->
  <path 
    d="M 58 25 L 28 80 C 35 70, 45 60, 55 45 Z" 
    fill="#ffffff" 
    opacity="0.5" 
  />
  <!-- Small dot highlight -->
  <circle cx="58" cy="35" r="4" fill="#ffffff" opacity="0.8" />

  <!-- Blush / Cheeks -->
  <circle cx="35" cy="85" r="9" fill="#FF8A66" opacity="0.8" />
  <circle cx="85" cy="85" r="9" fill="#FF8A66" opacity="0.8" />

  <!-- Eyes (Dark brown/black) -->
  <circle cx="45" cy="70" r="6" fill="#4A3419" />
  <!-- Eye highlights -->
  <circle cx="43" cy="68" r="2.5" fill="#ffffff" />
  
  <circle cx="75" cy="70" r="6" fill="#4A3419" />
  <!-- Eye highlights -->
  <circle cx="73" cy="68" r="2.5" fill="#ffffff" />

  <!-- Mouth (Smile) -->
  <path d="M 54 78 Q 60 86 66 78" fill="none" stroke="#4A3419" stroke-width="4.5" stroke-linecap="round" />
</svg>
