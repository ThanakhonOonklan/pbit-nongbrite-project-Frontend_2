<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="triGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55" />
      <stop offset="100%" stop-color="#FFB323" />
    </linearGradient>
    
    <!-- Sticker shadow -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- White border (Sticker effect) -->
  <path 
    d="M 60 15 L 105 95 C 108 100, 105 105, 100 105 L 20 105 C 15 105, 12 100, 15 95 L 60 15 Z" 
    fill="#FFFFFF" 
    filter="url(#stickerShadow)"
    stroke="#FFFFFF"
    stroke-width="21"
    stroke-linejoin="round"
  />
  
  <!-- Base Triangle Body -->
  <path 
    d="M 60 15 L 105 95 C 108 100, 105 105, 100 105 L 20 105 C 15 105, 12 100, 15 95 L 60 15 Z" 
    fill="url(#triGrad)" 
    stroke="#D98A00" 
    stroke-width="5" 
    stroke-linejoin="round" 
  />

  <!-- Main highlight -->
  <path 
    d="M 58 25 L 35 70 C 40 60, 50 50, 58 40 Z" 
    fill="#ffffff" 
    opacity="0.4" 
  />
  <circle cx="58" cy="35" r="4" fill="#ffffff" opacity="0.6" />

  <!-- Blush / Cheeks - Centered -->
  <circle cx="42" cy="78" r="8" fill="#FF8A66" opacity="0.8" />
  <circle cx="78" cy="78" r="8" fill="#FF8A66" opacity="0.8" />

  <!-- Eyes - Centered vertically (for triangle, 72 is better because it's wider at bottom) -->
  <circle cx="48" cy="65" r="5.5" fill="#4A3419" />
  <!-- Eye highlights -->
  <circle cx="46.5" cy="63.5" r="2" fill="#ffffff" />
  
  <circle cx="72" cy="65" r="5.5" fill="#4A3419" />
  <!-- Eye highlights -->
  <circle cx="70.5" cy="63.5" r="2" fill="#ffffff" />

  <!-- Mouth (Smile) - Centered -->
  <path d="M 55 72 Q 60 78 65 72" fill="none" stroke="#4A3419" stroke-width="4.5" stroke-linecap="round" />
</svg>
