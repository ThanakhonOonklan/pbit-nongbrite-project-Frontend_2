<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Base gradient - Emerald Green -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Sticker shadow -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- White border (Sticker effect) -->
  <path 
    d="M 60 12 
       L 102 36 
       L 102 84 
       L 60 108 
       L 18 84 
       L 18 36 
       Z" 
    fill="#FFFFFF" 
    filter="url(#stickerShadow)"
    stroke="#FFFFFF"
    stroke-width="21"
    stroke-linejoin="round"
  />
  
  <!-- Base Hexagon Body (Regular Hexagon) -->
  <path 
    d="M 60 12 
       L 102 36 
       L 102 84 
       L 60 108 
       L 18 84 
       L 18 36 
       Z" 
    fill="url(#hexGrad)" 
    stroke="#059669" 
    stroke-width="5" 
    stroke-linejoin="round"
  />

  <!-- Main highlight -->
  <path 
    d="M 55 20 L 25 40 C 30 35, 40 30, 50 25 Z" 
    fill="#ffffff" 
    opacity="0.4" 
  />
  <circle cx="50" cy="25" r="3.5" fill="#ffffff" opacity="0.6" />

  <!-- Blush / Cheeks - Centered -->
  <circle cx="38" cy="74" r="9" fill="#10B981" opacity="0.8" />
  <circle cx="82" cy="74" r="9" fill="#10B981" opacity="0.8" />

  <!-- Eyes - Centered -->
  <circle cx="48" cy="60" r="5.5" fill="#064E3B" />
  <!-- Eye highlights -->
  <circle cx="46.5" cy="58.5" r="2.5" fill="#ffffff" />
  
  <circle cx="72" cy="60" r="5.5" fill="#064E3B" />
  <!-- Eye highlights -->
  <circle cx="70.5" cy="58.5" r="2.5" fill="#ffffff" />

  <!-- Mouth (Smile) - Centered -->
  <path d="M 55 68 Q 60 74 65 68" fill="none" stroke="#064E3B" stroke-width="4.5" stroke-linecap="round" />
</svg>
