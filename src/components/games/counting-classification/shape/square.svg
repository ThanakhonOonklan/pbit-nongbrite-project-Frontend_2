<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="sqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4" />
      <stop offset="100%" stop-color="#21A098" />
    </linearGradient>
    
    <!-- Sticker shadow (subtle drop shadow for the white border) -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- White border (Sticker effect) -->
  <rect x="12" y="12" width="96" height="96" rx="20" fill="#FFFFFF" filter="url(#stickerShadow)" />
  
  <!-- Base Square Body -->
  <rect x="20" y="20" width="80" height="80" rx="15" fill="url(#sqGrad)" stroke="#197A73" stroke-width="5" stroke-linejoin="round" />

  <!-- Main highlight (top left) -->
  <path d="M 28 35 C 35 25, 55 25, 65 30 C 50 35, 40 45, 35 60 Z" fill="#ffffff" opacity="0.4" />
  <!-- Corner dot highlight -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" opacity="0.6" />

  <!-- Blush / Cheeks - Centered vertically -->
  <circle cx="38" cy="72" r="9" fill="#2CB5AD" opacity="0.8" />
  <circle cx="82" cy="72" r="9" fill="#2CB5AD" opacity="0.8" />

  <!-- Eyes - Centered vertically -->
  <circle cx="45" cy="58" r="5.5" fill="#144A46" />
  <!-- Eye highlights -->
  <circle cx="43.5" cy="56.5" r="2" fill="#ffffff" />
  
  <circle cx="75" cy="58" r="5.5" fill="#144A46" />
  <!-- Eye highlights -->
  <circle cx="73.5" cy="56.5" r="2" fill="#ffffff" />

  <!-- Mouth (Smile) - Centered vertically -->
  <path d="M 55 65 Q 60 71 65 65" fill="none" stroke="#144A46" stroke-width="4.5" stroke-linecap="round" />
</svg>
