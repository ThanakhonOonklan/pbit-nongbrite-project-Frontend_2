<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Base gradient - Purple -->
    <linearGradient id="pentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <!-- Sticker shadow -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- White border (Sticker effect) -->
  <path 
    d="M 60 12 
       L 106 45 
       L 88 98 
       L 32 98 
       L 14 45 
       Z" 
    fill="#FFFFFF" 
    filter="url(#stickerShadow)"
    stroke="#FFFFFF"
    stroke-width="21"
    stroke-linejoin="round"
  />
  
  <!-- Base Pentagon Body (Regular Pentagon) -->
  <path 
    d="M 60 12 
       L 106 45 
       L 88 98 
       L 32 98 
       L 14 45 
       Z" 
    fill="url(#pentGrad)" 
    stroke="#7C3AED" 
    stroke-width="5" 
    stroke-linejoin="round"
  />

  <!-- Main highlight -->
  <path 
    d="M 58 22 L 30 45 C 35 40, 45 35, 55 30 Z" 
    fill="#ffffff" 
    opacity="0.4" 
  />
  <circle cx="58" cy="28" r="3" fill="#ffffff" opacity="0.6" />

  <!-- Blush / Cheeks - Centered -->
  <circle cx="40" cy="72" r="9" fill="#F472B6" opacity="0.7" />
  <circle cx="80" cy="72" r="9" fill="#F472B6" opacity="0.7" />

  <!-- Eyes - Centered -->
  <circle cx="48" cy="58" r="5.5" fill="#4C1D95" />
  <!-- Eye highlights -->
  <circle cx="46.5" cy="56.5" r="2.5" fill="#ffffff" />
  
  <circle cx="72" cy="58" r="5.5" fill="#4C1D95" />
  <!-- Eye highlights -->
  <circle cx="70.5" cy="56.5" r="2.5" fill="#ffffff" />

  <!-- Mouth (Smile) - Centered -->
  <path d="M 55 65 Q 60 71 65 65" fill="none" stroke="#4C1D95" stroke-width="4.5" stroke-linecap="round" />
</svg>
