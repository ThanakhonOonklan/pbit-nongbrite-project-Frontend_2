<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
  <defs>
    <!-- Cloud Shadow -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#8BB4E1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rainbow Arcs -->
  <!-- Pink -->
  <path d="M 20,130 A 130,110 0 0,1 280,130" fill="none" stroke="#FFB5C5" stroke-width="22" stroke-linecap="round"/>
  <!-- Yellow -->
  <path d="M 41,130 A 109,89 0 0,1 259,130" fill="none" stroke="#FFF085" stroke-width="22" stroke-linecap="round"/>
  <!-- Green -->
  <path d="M 62,130 A 88,68 0 0,1 238,130" fill="none" stroke="#8DE8B9" stroke-width="22" stroke-linecap="round"/>
  <!-- Blue -->
  <path d="M 83,130 A 67,47 0 0,1 217,130" fill="none" stroke="#71D5FF" stroke-width="22" stroke-linecap="round"/>

  <!-- Sparkles / Stars -->
  <g fill="#FFF085">
    <path d="M 150,15 Q 150,27 162,27 Q 150,27 150,39 Q 150,27 138,27 Q 150,27 150,15 Z" />
    <path d="M 70,35 Q 70,42 77,42 Q 70,42 70,49 Q 70,42 63,42 Q 70,42 70,35 Z" />
    <path d="M 235,50 Q 235,56 241,56 Q 235,56 235,62 Q 235,56 229,56 Q 235,56 235,50 Z" />
    <circle cx="100" cy="20" r="3" />
    <circle cx="200" cy="30" r="4" />
    <circle cx="120" cy="45" r="2.5" />
  </g>

  <!-- Left Clouds -->
  <g fill="#FFFFFF" filter="url(#cloudShadow)">
    <circle cx="50" cy="120" r="30" />
    <circle cx="85" cy="130" r="25" />
    <circle cx="25" cy="135" r="20" />
    <rect x="25" y="125" width="60" height="30" rx="15" />
  </g>
  
  <!-- Right Clouds -->
  <g fill="#FFFFFF" filter="url(#cloudShadow)">
    <circle cx="250" cy="120" r="30" />
    <circle cx="215" cy="130" r="25" />
    <circle cx="275" cy="135" r="20" />
    <rect x="215" y="125" width="60" height="30" rx="15" />
  </g>
</svg>
