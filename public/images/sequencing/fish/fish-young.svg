<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ── UNDERWATER BACKGROUND ── -->
  <path d="M0,200 L200,200 L200,0 L0,0 Z" fill="#607D8B"/>
  <path d="M50,200 Q80,120 10,100" fill="none" stroke="#DCE775" stroke-width="12" stroke-linecap="round"/>
  <path d="M150,200 Q120,80 190,60" fill="none" stroke="#DCE775" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Bubbles -->
  <circle cx="150" cy="120" r="8" fill="#E1F5FE" stroke="#81D4FA" stroke-width="2" opacity="0.7"/>
  <circle cx="165" cy="90" r="5" fill="#E1F5FE" stroke="#81D4FA" stroke-width="2" opacity="0.7"/>
  <circle cx="155" cy="60" r="3" fill="#E1F5FE" stroke="#81D4FA" stroke-width="2" opacity="0.7"/>

  <!-- ── YOUNG CLOWNFISH ── -->
  <!-- Top Fin -->
  <path d="M80,85 C90,65 110,65 120,90 Z" fill="#FF9800" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M125,95 C130,80 145,85 140,100 Z" fill="#FF9800" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Bottom Fins -->
  <path d="M85,115 L95,130 L105,115" fill="#FF9800" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M115,115 L125,125 L130,110" fill="#FF9800" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Tail Fin -->
  <path d="M150,100 L175,80 L165,100 L175,120 Z" fill="#FF9800" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- White Stripe on Tail -->
  <path d="M158,90 C155,100 155,110 158,110" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M158,90 C155,100 155,110 158,110" fill="none" stroke="#1A1A1A" stroke-width="1"/> <!-- detail line -->

  <!-- Body (Orange) -->
  <ellipse cx="100" cy="100" rx="55" ry="30" fill="#FF9800" stroke="#1A1A1A" stroke-width="3"/>

  <!-- White Bands (3 stripes) -->
  <!-- Band 1 (Head) -->
  <path d="M75,74 C65,90 65,110 75,126" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M69,76 C59,90 59,110 69,124 M81,76 C71,90 71,110 81,124" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/> <!-- Black border -->

  <!-- Band 2 (Middle) -->
  <path d="M110,72 C105,90 105,110 110,128" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M105,74 C100,90 100,110 105,126 M115,74 C110,90 110,110 115,126" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/> <!-- Black border -->

  <!-- Band 3 (Tail Base) -->
  <path d="M145,84 C140,95 140,105 145,116" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <path d="M141,86 C136,95 136,105 141,114 M149,86 C144,95 144,105 149,114" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/> <!-- Black border -->

  <!-- Eye -->
  <circle cx="60" cy="92" r="6" fill="#1A1A1A"/>
  <circle cx="58" cy="90" r="2" fill="#FFFFFF"/>
  <circle cx="60" cy="92" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5"/> <!-- White eye ring -->

  <!-- Smile -->
  <path d="M50,110 Q55,115 62,110" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Side Fin (Pectoral) -->
  <path d="M85,100 C95,95 105,105 95,110 Z" fill="#FF9800" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M95,101 L95,109" fill="none" stroke="#FFFFFF" stroke-width="2"/>
</svg>
