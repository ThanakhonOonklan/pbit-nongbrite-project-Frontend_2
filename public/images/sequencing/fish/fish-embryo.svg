<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ── UNDERWATER BACKGROUND/ROCK ── -->
  <path d="M20,180 Q80,100 180,160 L180,200 L20,200 Z" fill="#607D8B"/>
  <path d="M40,160 Q30,120 10,110" fill="none" stroke="#DCE775" stroke-width="8" stroke-linecap="round"/>
  <path d="M140,160 Q150,110 170,100" fill="none" stroke="#DCE775" stroke-width="8" stroke-linecap="round"/>

  <!-- ── CLOWNFISH EGGS (Cluster) ── -->
  <ellipse cx="100" cy="145" rx="40" ry="15" fill="#455A64"/>
  
  <ellipse cx="80" cy="135" rx="10" ry="14" fill="#FFA726" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="80" cy="132" r="3" fill="#FFFFFF" opacity="0.4"/>
  
  <ellipse cx="120" cy="136" rx="10" ry="14" fill="#FFA726" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="120" cy="133" r="3" fill="#FFFFFF" opacity="0.4"/>
  
  <ellipse cx="70" cy="148" rx="11" ry="15" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
  <ellipse cx="130" cy="149" rx="11" ry="15" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>

  <!-- ── HATCHING EMBRYO EGGS (Center feature) ── -->
  <defs>
    <!-- Curled Fish Embryo -->
    <g id="curled-embryo">
      <!-- Orange Yolk Sac (attached to belly) -->
      <circle cx="-5" cy="2" r="5" fill="#FFCA28" stroke="#F57C00" stroke-width="0.5"/>
      <!-- Curled Body (Orange Bean) -->
      <path d="M 0,-10 C 12,-10 12,10 0,10 C -5,10 -5,0 0,-10 Z" fill="#FF9800" stroke="#E65100" stroke-width="0.5"/>
      <!-- Tiny Tail Fin -->
      <path d="M 0,9 L 7,16 L -4,15 Z" fill="#FF9800" stroke="#E65100" stroke-width="0.5" stroke-linejoin="round"/>
      <!-- Tiny Side Fin -->
      <path d="M 2,0 C 7,-2 7,4 2,2 Z" fill="#FF9800" stroke="#FFFFFF" stroke-width="0.5"/>
      <!-- White Stripe (Clownfish feature) -->
      <path d="M 5,-5 C 6,-3 6,3 5,5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <!-- Big Cute Eye (Attached correctly) -->
      <circle cx="-2" cy="-6" r="3" fill="#1A1A1A"/>
      <circle cx="-3" cy="-7" r="1" fill="#FFFFFF"/>
    </g>
  </defs>

  <!-- Group 1 -->
  <g transform="translate(-10, 0)">
    <ellipse cx="100" cy="145" rx="14" ry="18" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2.5" opacity="0.9"/>
    <!-- Curled Embryo -->
    <use href="#curled-embryo" x="100" y="145" transform="rotate(-20, 100, 145) scale(1.1)"/>
    <!-- Egg highlight -->
    <path d="M 90,135 Q 95,130 100,132" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Group 2 -->
  <g transform="translate(20, -5)">
    <ellipse cx="100" cy="150" rx="15" ry="19" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2.5" opacity="0.8"/>
    <!-- Curled Embryo -->
    <use href="#curled-embryo" x="100" y="150" transform="rotate(45, 100, 150) scale(1.3) scale(-1, 1)"/>
    <path d="M 90,140 Q 95,135 100,137" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Water bubbles -->
  <circle cx="70" cy="60" r="4" fill="#E1F5FE" stroke="#81D4FA" stroke-width="1.5" opacity="0.7"/>
  <circle cx="110" cy="80" r="6" fill="#E1F5FE" stroke="#81D4FA" stroke-width="1.5" opacity="0.7"/>
</svg>
