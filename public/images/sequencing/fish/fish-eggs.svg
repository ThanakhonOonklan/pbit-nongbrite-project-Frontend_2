<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ── UNDERWATER BACKGROUND/ROCK ── -->
  <path d="M20,180 Q80,100 180,160 L180,200 L20,200 Z" fill="#607D8B"/>
  <!-- Sea Anemone tentacles subtly in background -->
  <path d="M40,160 Q30,120 10,110" fill="none" stroke="#DCE775" stroke-width="8" stroke-linecap="round"/>
  <path d="M60,150 Q50,90 40,80" fill="none" stroke="#DCE775" stroke-width="8" stroke-linecap="round"/>
  <path d="M140,160 Q150,110 170,100" fill="none" stroke="#DCE775" stroke-width="8" stroke-linecap="round"/>
  <path d="M160,170 Q180,140 190,145" fill="none" stroke="#DCE775" stroke-width="8" stroke-linecap="round"/>

  <!-- ── CLOWNFISH EGGS (Cluster) ── -->
  <!-- Base cluster shadow -->
  <ellipse cx="100" cy="145" rx="40" ry="15" fill="#455A64"/>
  
  <!-- Back row eggs -->
  <ellipse cx="80" cy="135" rx="10" ry="14" fill="#FFA726" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="80" cy="132" r="3" fill="#FFFFFF" opacity="0.4"/>
  
  <ellipse cx="100" cy="132" rx="10" ry="14" fill="#FFA726" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="100" cy="129" r="3" fill="#FFFFFF" opacity="0.4"/>
  
  <ellipse cx="120" cy="136" rx="10" ry="14" fill="#FFA726" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="120" cy="133" r="3" fill="#FFFFFF" opacity="0.4"/>

  <!-- Front row eggs -->
  <ellipse cx="70" cy="148" rx="11" ry="15" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="70" cy="145" r="3" fill="#FFFFFF" opacity="0.6"/>

  <ellipse cx="90" cy="145" rx="11" ry="15" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="90" cy="142" r="3" fill="#FFFFFF" opacity="0.6"/>

  <ellipse cx="110" cy="147" rx="11" ry="15" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="110" cy="144" r="3" fill="#FFFFFF" opacity="0.6"/>

  <ellipse cx="130" cy="149" rx="11" ry="15" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
  <circle cx="130" cy="146" r="3" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Center prominent egg -->
  <ellipse cx="100" cy="152" rx="12" ry="16" fill="#FFCC80" stroke="#FF9800" stroke-width="2.5"/>
  <circle cx="100" cy="148" r="4" fill="#FFFFFF" opacity="0.8"/>

  <!-- Tiny connecting threads -->
  <path d="M100,168 L100,175 M80,165 L80,175 M120,165 L120,175" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/>

  <!-- Water bubbles -->
  <circle cx="60" cy="70" r="5" fill="#E1F5FE" stroke="#81D4FA" stroke-width="1.5" opacity="0.7"/>
  <circle cx="130" cy="50" r="8" fill="#E1F5FE" stroke="#81D4FA" stroke-width="1.5" opacity="0.7"/>
  <circle cx="145" cy="80" r="4" fill="#E1F5FE" stroke="#81D4FA" stroke-width="1.5" opacity="0.7"/>
</svg>
