<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Legs -->
  <line x1="180" y1="350" x2="180" y2="450" stroke="#1F2937" stroke-width="16" stroke-linecap="round"/>
  <line x1="330" y1="350" x2="330" y2="450" stroke="#1F2937" stroke-width="16" stroke-linecap="round"/>
  <line x1="220" y1="350" x2="220" y2="430" stroke="#374151" stroke-width="16" stroke-linecap="round"/>
  <line x1="290" y1="350" x2="290" y2="430" stroke="#374151" stroke-width="16" stroke-linecap="round"/>
  <!-- Body Fluff -->
  <path d="M256 100 C360 100, 420 150, 440 230 C500 240, 480 360, 360 370 C360 410, 150 410, 150 370 C30 360, 10 240, 70 230 C90 150, 150 100, 256 100 Z" fill="#E2E8F0"/>
  <!-- Head -->
  <ellipse cx="140" cy="200" rx="45" ry="55" fill="#94A3B8"/>
  <!-- Horns -->
  <path d="M120 150 C80 120, 60 160, 90 190" stroke="#D4D4D8" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M160 150 C200 120, 220 160, 190 190" stroke="#D4D4D8" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="120" cy="190" r="6" fill="#1F2937"/>
  <circle cx="160" cy="190" r="6" fill="#1F2937"/>
  <!-- Nose/Mouth -->
  <path d="M140 220 L140 240 M125 240 Q140 255 155 240" stroke="#1F2937" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="80" cy="210" rx="30" ry="10" fill="#94A3B8" transform="rotate(15 80 210)"/>
  <ellipse cx="200" cy="210" rx="30" ry="10" fill="#94A3B8" transform="rotate(-15 200 210)"/>
  <!-- Head Fluff -->
  <circle cx="140" cy="150" r="35" fill="#E2E8F0"/>
</svg>
