<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 0 L512 0 L512 512 L0 512 Z" fill="#BAE6FD" />
  
  <!-- Simple Plant Stem & Big Leaf -->
  <path d="M256 512 L256 200" stroke="#15803D" stroke-width="20" stroke-linecap="round"/>
  
  <g transform="translate(256, 300) rotate(-30 0 0)">
    <!-- Big Green Leaf -->
    <path d="M0 0 C70 0, 170 -150, -30 -350 C-230 -150, -130 0, 0 0 Z" fill="#22C55E" />
    <path d="M0 0 C70 0, 170 -150, -30 -350" fill="none" stroke="#15803D" stroke-width="8"/>
    <path d="M0 0 C-230 -150, -130 0, 0 0" fill="none" stroke="#15803D" stroke-width="8"/>
    
    <!-- Veins -->
    <path d="M0 0 Q-20 -150, -30 -330" stroke="#15803D" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M-5 -50 Q20 -70, 40 -100" stroke="#15803D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-10 -100 Q-60 -120, -80 -150" stroke="#15803D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-15 -150 Q20 -170, 50 -200" stroke="#15803D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-20 -200 Q-70 -220, -90 -250" stroke="#15803D" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
