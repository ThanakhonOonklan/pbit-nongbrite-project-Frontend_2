  <path d="M256 180 L256 335" stroke="#E0F2FE" stroke-width="8" fill="none" opacity="0.8"/>
  
  <!-- Kettle pouring (Tilted) -->
  <g transform="translate(-100, -80) rotate(-30 350 200)">
    <!-- Body -->
    <path d="M256 150 C236 220, 236 280, 256 290 L416 290 C436 280, 436 220, 416 150 C396 80, 366 80, 336 80 C306 80, 276 80, 256 150 Z" fill="#94A3B8" />
