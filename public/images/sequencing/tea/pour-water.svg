  <ellipse cx="256" cy="435" rx="60" ry="15" fill="#F1F5F9" />
  
  <!-- Teacup -->
  <path d="M186 330 C186 430, 206 430, 256 430 C306 430, 326 430, 326 330 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
  <path d="M326 350 C366 340, 376 390, 326 400" stroke="#E2E8F0" stroke-width="15" fill="none" stroke-linecap="round" />
  
