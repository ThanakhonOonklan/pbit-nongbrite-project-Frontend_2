  <path d="M220 330 L200 360" stroke="#CBD5E1" stroke-width="3" fill="none" />
  <rect x="190" y="360" width="20" height="25" rx="2" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" transform="rotate(-15 190 360)"/>
  
  <!-- Hot Water filling cup -->
  <!-- Inner cup -->
  <ellipse cx="256" cy="330" rx="70" ry="20" fill="#F1F5F9" />
  <ellipse cx="256" cy="335" rx="60" ry="15" fill="#BAE6FD" opacity="0.5" />
