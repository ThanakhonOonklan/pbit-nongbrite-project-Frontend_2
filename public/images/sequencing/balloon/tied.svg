<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g transform="translate(0, -5)"> <!-- Shift up slightly to fit knot better -->
    <!-- Full Size Balloon Body -->
    <path d="M100,20 C180,20 180,150 108,160 L104,170 L96,170 L92,160 C20,150 20,20 100,20 Z" fill="#FF5252" stroke="#D32F2F" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Tied Knot -->
    <circle cx="100" cy="165" r="7" fill="#FF5252" stroke="#D32F2F" stroke-width="3"/>
    <path d="M100,165 L115,180 L85,180 Z" fill="#FF5252" stroke="#D32F2F" stroke-width="3" stroke-linejoin="round"/>
    <!-- Knot detail wrinkles -->
    <path d="M100,165 L95,175 M100,165 L105,175" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linecap="round"/>

    <!-- Big Highlight -->
