<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ── TOWEL ── (hanging, simple striped rectangle) -->
  <!-- Towel body -->
  <rect x="28" y="20" width="144" height="88" rx="10" fill="#FFF8F0" stroke="#BDBDBD" stroke-width="3"/>
  <!-- Towel top hem (darker stripe) -->
  <rect x="28" y="20" width="144" height="14" rx="5" fill="#E0E0E0"/>
  <!-- Towel stripes (horizontal decorative) -->
  <rect x="28" y="48" width="144" height="8"  fill="#FFF3E0" opacity="0.8"/>
  <rect x="28" y="68" width="144" height="8"  fill="#FFF3E0" opacity="0.8"/>
  <rect x="28" y="88" width="144" height="8"  fill="#FFF3E0" opacity="0.8"/>
  <!-- Towel rolled-edge shadow -->
  <rect x="28" y="104" width="144" height="4"  rx="2" fill="#BDBDBD" opacity="0.4"/>

  <!-- ── HANDS PRESSING INTO TOWEL ── -->
  <!-- Left hand pressing in (fingers down into towel) -->
  <rect x="47" y="96"  width="10" height="28" rx="5"   fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="58" y="90"  width="11" height="34" rx="5.5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="69" y="88"  width="12" height="36" rx="6"   fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="81" y="90"  width="11" height="34" rx="5.5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <!-- Palm L -->
  <rect x="44" y="116" width="52" height="28" rx="12"  fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <!-- Thumb L -->
  <rect x="30" y="118" width="18" height="20" rx="9" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(-22,39,128)"/>

  <!-- Right hand -->
  <rect x="108" y="90"  width="11" height="34" rx="5.5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="119" y="88"  width="12" height="36" rx="6"   fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="131" y="90"  width="11" height="34" rx="5.5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="142" y="96"  width="10" height="28" rx="5"   fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <!-- Palm R -->
  <rect x="104" y="116" width="52" height="28" rx="12"  fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <!-- Thumb R -->
  <rect x="152" y="118" width="18" height="20" rx="9" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(22,161,128)"/>

  <!-- Towel bottom folding over hands -->
  <rect x="28" y="136" width="144" height="50" rx="10" fill="#FFF8F0" stroke="#BDBDBD" stroke-width="3"/>
  <rect x="28" y="136" width="144" height="10" rx="5" fill="#E0E0E0" opacity="0.6"/>

  <!-- Motion lines (wiping suggestion) -->
  <path d="M34,170 L54,170" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M30,178 L58,178" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M146,170 L166,170" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M142,178 L170,178" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>
