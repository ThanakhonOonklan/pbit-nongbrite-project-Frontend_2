<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ── FAUCET (larger, centred — no water flowing) ── -->
  <!-- Wall bracket -->
  <rect x="14" y="30" width="26" height="50" rx="8" fill="#9E9E9E" stroke="#757575" stroke-width="2.5"/>
  <!-- Horizontal pipe -->
  <rect x="40" y="40" width="76" height="16" rx="8" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="2"/>
  <!-- Vertical spout -->
  <rect x="98" y="56" width="18" height="48" rx="9" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="2"/>
  <!-- Spout tip (dry — no water) -->
  <rect x="93" y="100" width="28" height="9" rx="4.5" fill="#9E9E9E"/>
  <!-- Just a drop hint at tip (almost dry) -->
  <path d="M107,109 C106,112 102,115 107,118 C112,115 108,112 107,109Z"
    fill="#B3E5FC" opacity="0.5"/>

  <!-- ── LEVER handle ── (highlighted = being touched) -->
  <rect x="55" y="26" width="40" height="13" rx="6.5" fill="#0288D1" stroke="#01579B" stroke-width="2.5"/>
  <rect x="72" y="14" width="12" height="16" rx="6" fill="#0288D1" stroke="#01579B" stroke-width="2"/>

  <!-- ── HAND reaching to turn off lever ── (right hand, elevated) -->
  <!-- Arm reaching up -->
  <rect x="118" y="82" width="30" height="62" rx="15" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <!-- Palm (horizontal, gripping lever) -->
  <rect x="82" y="28" width="52" height="26" rx="12" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <!-- Fingers curled over lever -->
  <rect x="88"  y="14" width="10" height="20" rx="5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="100" y="11" width="11" height="22" rx="5.5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="112" y="12" width="11" height="21" rx="5.5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <rect x="124" y="15" width="10" height="18" rx="5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>
  <!-- Thumb below lever -->
  <rect x="88" y="50" width="46" height="14" rx="7" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/>

  <!-- Action arrow (turning motion) -->
  <path d="M148,36 A20,20 0 0 1 148,58"
    fill="none" stroke="#FF7043" stroke-width="4" stroke-linecap="round"
    marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8Z" fill="#FF7043"/>
    </marker>
  </defs>

  <!-- No-water label (X mark on spout) -->
  <line x1="93" y1="116" x2="121" y2="128" stroke="#EF5350" stroke-width="3" stroke-linecap="round"/>
  <line x1="121" y1="116" x2="93"  y2="128" stroke="#EF5350" stroke-width="3" stroke-linecap="round"/>
</svg>
