<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  
  <!-- Pan -->
  <path d="M156 380 L356 380 C356 430, 316 450, 256 450 C196 450, 156 430, 156 380 Z" fill="#1E293B" />
