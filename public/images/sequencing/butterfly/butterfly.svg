<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Left Wing Structure -->
    <g id="leftWing">
      <!-- Top Wing -->
      <path d="M100,100 C70,10 0,0 10,80 C15,110 50,115 100,100 Z" fill="#FF9800" stroke="#212121" stroke-width="6"/>
      <!-- Inner top wing pattern -->
      <path d="M90,90 C65,30 20,25 25,75 C30,95 55,95 90,90 Z" fill="#FF5722"/>
      <circle cx="35" cy="45" r="6" fill="#F4511E"/>
      <circle cx="55" cy="30" r="5" fill="#F4511E"/>
      <!-- Outer dots -->
      <circle cx="18" cy="60" r="2.5" fill="#FFFFFF"/>
      <circle cx="20" cy="80" r="2.5" fill="#FFFFFF"/>
      <circle cx="35" cy="100" r="2.5" fill="#FFFFFF"/>
      
      <!-- Bottom Wing -->
      <path d="M100,100 C70,120 40,190 20,180 C0,170 10,130 100,100 Z" fill="#FFB74D" stroke="#212121" stroke-width="6"/>
      <!-- Inner bottom wing pattern -->
      <path d="M90,110 C65,125 45,170 30,165 C15,160 30,135 90,110 Z" fill="#FFA726"/>
      <!-- Bottom Outer Dots -->
      <circle cx="22" cy="150" r="2" fill="#FFFFFF"/>
      <circle cx="35" cy="170" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Right Wing mapped from Left Wing -->
    <g id="rightWing" transform="translate(200, 0) scale(-1, 1)">
      <use href="#leftWing" />
    </g>
  </defs>

  <!-- Render Wings -->
  <use href="#leftWing" />
  <use href="#rightWing" />

  <!-- ── BUTTERFLY BODY ── -->
  <!-- Antennae -->
  <path d="M95,40 C85,20 70,20 75,10" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
  <circle cx="75" cy="10" r="3" fill="#212121"/>
  
  <path d="M105,40 C115,20 130,20 125,10" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
  <circle cx="125" cy="10" r="3" fill="#212121"/>

  <!-- Abdomen/Tail -->
  <ellipse cx="100" cy="115" rx="8" ry="35" fill="#424242"/>
  <!-- Thorax/Head -->
  <ellipse cx="100" cy="65" rx="10" ry="15" fill="#616161"/>
  <circle cx="100" cy="45" r="10" fill="#424242"/>

  <!-- Face -->
  <!-- Eyes -->
  <circle cx="95" cy="42" r="2.5" fill="#FFFFFF"/>
  <circle cx="105" cy="42" r="2.5" fill="#FFFFFF"/>
  <circle cx="95" cy="42" r="1" fill="#1A1A1A"/>
  <circle cx="105" cy="42" r="1" fill="#1A1A1A"/>
  <!-- Smile -->
  <path d="M96,48 Q100,52 104,48" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
