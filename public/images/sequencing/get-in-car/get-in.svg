<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 400 L512 400 L512 512 L0 512 Z" fill="#94A3B8" /> 
  
  <g transform="translate(50, 200)">
    <path d="M0 150 Q0 100 50 100 L120 100 L180 30 L300 30 L380 100 L420 100 Q450 100 450 150 L450 200 L0 200 Z" fill="#EF4444" />
    <path d="M130 100 L185 40 L240 40 L240 100 Z" fill="#334155" /> 
    <path d="M250 40 L295 40 L360 100 L250 100 Z" fill="#334155" /> 
    
    <!-- Open Door Interior -->
    <path d="M120 100 L240 100 L240 200 L120 200 Z" fill="#94A3B8" /> 
    <!-- Car Seat visible -->
    <path d="M140 120 L180 120 L180 200 L140 200 Z" fill="#334155" rx="10"/>
    
    <!-- Person getting in -->
    <g transform="translate(130, 20)">
      <circle cx="20" cy="30" r="25" fill="#FCA5A5" />
      <!-- Body bending in -->
      <path d="M-10 80 L30 70 L40 130 L0 140 Z" fill="#3B82F6" rx="5"/>
      <!-- Legs -->
      <path d="M20 135 L40 180" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round"/> <!-- One leg inside -->
      <path d="M0 140 L-20 200" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round"/> <!-- One leg outside -->
      <!-- Arms holding -->
      <path d="M0 80 L40 100" stroke="#FCA5A5" stroke-width="10" stroke-linecap="round"/>
    </g>
    
    <!-- Door -->
    <path d="M120 100 L80 150 L80 250 L120 200 Z" fill="#DC2626" />
    <path d="M130 100 L95 150 L95 200 L130 140 Z" fill="#334155" opacity="0.8"/>
    
    <circle cx="100" cy="200" r="40" fill="#1E293B" />
    <circle cx="100" cy="200" r="20" fill="#CBD5E1" />
    <circle cx="350" cy="200" r="40" fill="#1E293B" />
    <circle cx="350" cy="200" r="20" fill="#CBD5E1" />
  </g>
</svg>
