<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sky -->
  <path d="M0 0 L512 0 L512 300 L0 300 Z" fill="#38BDF8" />
  <!-- Sun -->
  <circle cx="100" cy="80" r="40" fill="#FBBF24" />
  <!-- Clouds -->
  <path d="M200 120 Q230 90 260 120 Q290 100 320 120 Q350 120 340 150 L180 150 Q170 120 200 120 Z" fill="#FFFFFF" />
  <path d="M400 80 Q420 60 440 80 Q460 70 480 80 Q500 80 490 100 L380 100 Q370 80 400 80 Z" fill="#FFFFFF" />
  
  <!-- Road (Perspective) -->
  <path d="M0 300 L512 300 L512 512 L0 512 Z" fill="#10B981" /> <!-- Grass -->
  <path d="M156 300 L356 300 L512 512 L0 512 Z" fill="#475569" /> <!-- Road -->
  <path d="M256 300 L256 512" stroke="#FFFFFF" stroke-width="10" stroke-dasharray="20 20" /> <!-- Middle line -->
  
  <!-- Car driving away -->
  <g transform="translate(180, 220)">
    <path d="M20 100 L130 100 L150 150 L0 150 Z" fill="#EF4444" /> <!-- Back -->
    <path d="M30 100 L120 100 L130 50 L20 50 Z" fill="#334155" /> <!-- Back window -->
    <!-- Tail lights -->
    <rect x="10" y="110" width="20" height="15" fill="#DC2626" rx="2" />
    <rect x="120" y="110" width="20" height="15" fill="#DC2626" rx="2" />
    <path d="M5 117 L-10 117 M145 117 L160 117" stroke="#FCA5A5" stroke-width="4" /> <!-- Glow -->
    <!-- Wheels -->
    <circle cx="30" cy="150" r="15" fill="#1E293B" />
    <circle cx="120" cy="150" r="15" fill="#1E293B" />
    <!-- Exhaust smoke -->
    <circle cx="20" cy="160" r="10" fill="#CBD5E1" opacity="0.6" />
    <circle cx="0" cy="155" r="15" fill="#CBD5E1" opacity="0.5" />
    <circle cx="-20" cy="150" r="20" fill="#CBD5E1" opacity="0.3" />
  </g>
  
  <!-- Motion lines -->
  <path d="M100 400 L50 450 M412 400 L462 450" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
