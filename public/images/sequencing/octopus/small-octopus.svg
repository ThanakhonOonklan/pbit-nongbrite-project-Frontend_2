    <path d="M230 330 C180 400, 200 450, 230 430" stroke="#EC4899" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M256 330 C256 420, 256 450, 270 420" stroke="#EC4899" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M280 330 C330 400, 310 450, 280 430" stroke="#EC4899" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M312 320 C372 380, 412 350, 362 420" stroke="#EC4899" stroke-width="15" fill="none" stroke-linecap="round"/>
    
    <!-- Body (Pink) -->
