    <!-- Spots -->
    <circle cx="230" cy="150" r="5" fill="#BE185D" opacity="0.5"/>
    <circle cx="280" cy="170" r="8" fill="#BE185D" opacity="0.5"/>
    <circle cx="260" cy="140" r="6" fill="#BE185D" opacity="0.5"/>
    
    <!-- Big Cute Eyes -->
    <circle cx="210" cy="270" r="18" fill="#0F172A" />
    <circle cx="302" cy="270" r="18" fill="#0F172A" />
    <circle cx="205" cy="265" r="5" fill="#FFFFFF" />
    <circle cx="297" cy="265" r="5" fill="#FFFFFF" />
