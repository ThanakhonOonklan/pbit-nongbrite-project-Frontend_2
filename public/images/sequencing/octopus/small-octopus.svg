<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 0 L512 0 L512 512 L0 512 Z" fill="#0EA5E9" opacity="0.2" />
  <!-- Small Rock at bottom -->
  <path d="M150 450 C256 350, 350 400, 450 450 Z" fill="#94A3B8" />
  
  <g transform="translate(0, 10)">
