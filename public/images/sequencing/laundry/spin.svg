<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 350 L512 350 L512 512 L0 512 Z" fill="#F1F5F9" />
  <path d="M0 0 L512 0 L512 350 L0 350 Z" fill="#E2E8F0" />
  
  <!-- Washing Machine shaking slightly -->
  <g transform="translate(5, 0)"> <!-- Shifted to simulate shake -->
    <rect x="130" y="150" width="250" height="300" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="10"/>
    <rect x="135" y="155" width="240" height="60" rx="10" fill="#F8FAFC" />
    <circle cx="340" cy="185" r="15" fill="#F59E0B" /> <!-- Yellow light for spin -->
    <circle cx="160" cy="185" r="8" fill="#3B82F6" />
    
    <circle cx="255" cy="310" r="90" fill="#E2E8F0" stroke="#94A3B8" stroke-width="15"/>
    <circle cx="255" cy="310" r="75" fill="#1E293B" />
    
    <!-- Spinning motion inside drum -->
    <!-- Fast concentric circle lines -->
    <circle cx="255" cy="310" r="60" stroke="#38BDF8" stroke-width="8" stroke-dasharray="20 40" fill="none"/>
    <circle cx="255" cy="310" r="40" stroke="#FFFFFF" stroke-width="12" stroke-dasharray="15 30" fill="none" opacity="0.8"/>
    <circle cx="255" cy="310" r="20" stroke="#38BDF8" stroke-width="6" stroke-dasharray="10 20" fill="none"/>
    
    <!-- Blur effect for clothes spinning -->
    <path d="M210 270 Q280 250 290 320 Q240 360 200 310 Z" fill="#FFFFFF" opacity="0.4"/>
    <path d="M290 280 Q320 330 260 360 Q210 320 250 260 Z" fill="#FFFFFF" opacity="0.4"/>
    
    <!-- Glass reflection -->
    <path d="M190 260 A75 75 0 0 1 290 250 A65 65 0 0 0 190 260" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- Shaking motion lines -->
  <path d="M110 200 L120 220 M110 300 L120 320 M110 400 L120 420" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M400 200 L390 220 M400 300 L390 320 M400 400 L390 420" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
</svg>
