<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 350 L512 350 L512 512 L0 512 Z" fill="#F1F5F9" />
  <path d="M0 0 L512 0 L512 350 L0 350 Z" fill="#E2E8F0" />
  
  <!-- Table or Ironing Board -->
  <path d="M100 350 L412 350 L430 400 L80 400 Z" fill="#94A3B8" />
  
  <!-- Neatly Folded Clean Shirt -->
  <g transform="translate(150, 180)">
    <!-- Folded body -->
    <rect x="30" y="20" width="150" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="6"/>
    <!-- Collar -->
    <path d="M80 20 L105 50 L130 20 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4" stroke-linejoin="round"/>
    <path d="M105 50 L105 200" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="10 10"/> <!-- Button line -->
    <!-- Buttons -->
    <circle cx="105" cy="80" r="4" fill="#94A3B8" />
    <circle cx="105" cy="120" r="4" fill="#94A3B8" />
    <circle cx="105" cy="160" r="4" fill="#94A3B8" />
    
    <!-- Sleeves tucked in -->
    <path d="M30 40 Q50 100 30 150" stroke="#CBD5E1" stroke-width="4" fill="none"/>
    <path d="M180 40 Q160 100 180 150" stroke="#CBD5E1" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Sparkles -->
  <path d="M180 150 L190 160 M180 160 L190 150" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  <path d="M330 250 L340 260 M330 260 L340 250" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  <path d="M250 120 L260 130 M250 130 L260 120" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Sweet scent lines (Clean smell) -->
  <path d="M150 130 Q120 100 150 70 Q180 40 150 10" stroke="#F472B6" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M360 130 Q390 100 360 70 Q330 40 360 10" stroke="#F472B6" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
