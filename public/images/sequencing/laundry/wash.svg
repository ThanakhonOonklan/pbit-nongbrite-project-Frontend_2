<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 350 L512 350 L512 512 L0 512 Z" fill="#F1F5F9" />
  <path d="M0 0 L512 0 L512 350 L0 350 Z" fill="#E2E8F0" />
  
  <!-- Washing Machine -->
  <rect x="130" y="150" width="250" height="300" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="10"/>
  <rect x="135" y="155" width="240" height="60" rx="10" fill="#F8FAFC" />
  <circle cx="340" cy="185" r="15" fill="#EF4444" /> <!-- Red light indicating it's on -->
  <circle cx="160" cy="185" r="8" fill="#3B82F6" />
  <circle cx="185" cy="185" r="8" fill="#3B82F6" />
  
  <!-- Closed Door -->
  <circle cx="255" cy="310" r="90" fill="#E2E8F0" stroke="#94A3B8" stroke-width="15"/>
  <circle cx="255" cy="310" r="75" fill="#1E293B" />
  
  <!-- Inside Drum: Water and Suds and Shirt -->
  <!-- Water level -->
  <path d="M185 320 C220 300, 290 340, 325 320 L325 360 C290 380, 220 380, 185 360 Z" fill="#38BDF8" opacity="0.8"/>
  <!-- Bubbles/Suds -->
  <circle cx="210" cy="280" r="15" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="240" cy="260" r="20" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="270" cy="270" r="15" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="290" cy="290" r="10" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="230" cy="300" r="12" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="260" cy="310" r="18" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Glass reflection -->
  <path d="M190 260 A75 75 0 0 1 290 250 A65 65 0 0 0 190 260" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Splashing motion lines outside -->
  <path d="M170 300 Q150 280 140 310" stroke="#60A5FA" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M340 310 Q360 280 370 320" stroke="#60A5FA" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
