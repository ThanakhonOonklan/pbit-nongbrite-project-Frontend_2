<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Juvenile Elephant (Playful, Small Tusks) -->
  <g transform="translate(-10, 10)">
    <!-- Back Legs -->
    <rect x="260" y="270" width="35" height="90" rx="15" fill="#475569" />
    <rect x="370" y="270" width="35" height="90" rx="15" fill="#475569" />
    <!-- Body -->
    <path d="M180 230 C180 150, 390 150, 420 230 C430 300, 200 320, 180 230 Z" fill="#64748B" />
    <!-- Front Legs -->
    <rect x="210" y="280" width="40" height="90" rx="15" fill="#64748B" />
    <rect x="310" y="280" width="40" height="90" rx="15" fill="#64748B" />
    <!-- Toenails -->
    <path d="M215 360 Q230 350 245 360" stroke="#E2E8F0" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M315 360 Q330 350 345 360" stroke="#E2E8F0" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M410 200 Q450 220 440 280" stroke="#475569" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M440 280 L435 295 L445 295 Z" fill="#1E293B" />
    <!-- Back Ear -->
    <path d="M250 140 C300 110, 320 180, 280 230 C250 250, 230 200, 250 140 Z" fill="#475569" />
    <!-- Head -->
    <circle cx="180" cy="180" r="60" fill="#64748B" />
    <!-- Small Tusks -->
    <path d="M150 220 Q130 240 120 260" stroke="#F1F5F9" stroke-width="8" fill="none" stroke-linecap="round" />
    <!-- Trunk (Curved up playfully) -->
    <path d="M140 210 C100 250, 80 180, 100 130" fill="none" stroke="#64748B" stroke-width="25" stroke-linecap="round" />
    <!-- Front Ear -->
    <path d="M180 150 C120 100, 90 200, 130 240 C170 270, 210 200, 180 150 Z" fill="#94A3B8" />
    <!-- Eyes -->
    <circle cx="155" cy="170" r="8" fill="#1E293B" />
    <circle cx="195" cy="170" r="8" fill="#1E293B" />
    <circle cx="152" cy="167" r="3" fill="#FFFFFF" />
    <circle cx="192" cy="167" r="3" fill="#FFFFFF" />
  </g>
</svg>
