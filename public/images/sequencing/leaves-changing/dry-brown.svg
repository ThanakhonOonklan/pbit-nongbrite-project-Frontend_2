<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 0 L512 0 L512 512 L0 512 Z" fill="#BAE6FD" />
  
  <g transform="translate(100, 50)">
    <path d="M200 0 L180 50" stroke="#B45309" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Dry Brown/Orange Leaf, shrinking and curving -->
    <path d="M180 50 C230 50, 300 180, 160 380 C-10 180, 70 50, 180 50 Z" fill="#D97706" />
    <!-- Dry, brittle edges -->
    <path d="M180 50 C200 60, 230 100, 230 150 C230 180, 250 250, 160 380" fill="none" stroke="#78350F" stroke-width="8"/>
    <path d="M180 50 C140 60, 80 100, 80 150 C80 180, 60 250, 160 380" fill="none" stroke="#78350F" stroke-width="8"/>
    
    <!-- Spots of brown -->
    <circle cx="160" cy="120" r="15" fill="#92400E" opacity="0.8"/>
    <circle cx="210" cy="180" r="10" fill="#92400E" opacity="0.8"/>
    <circle cx="130" cy="250" r="20" fill="#92400E" opacity="0.8"/>
    
    <!-- Veins -->
    <path d="M180 50 Q160 200 155 360" stroke="#78350F" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M175 100 Q190 120 210 140" stroke="#78350F" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M170 150 Q130 170 110 190" stroke="#78350F" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M165 200 Q190 220 210 240" stroke="#78350F" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M160 250 Q120 270 100 290" stroke="#78350F" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M155 300 Q180 320 190 340" stroke="#78350F" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
