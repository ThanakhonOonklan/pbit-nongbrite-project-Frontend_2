<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 0 L512 0 L512 512 L0 512 Z" fill="#BAE6FD" />
  
  <!-- Ground -->
  <path d="M0 400 L512 400 L512 512 L0 512 Z" fill="#65A30D" />
  
  <!-- Broken branch high up -->
  <path d="M280 0 L260 50" stroke="#78350F" stroke-width="15" stroke-linecap="round"/>
  
  <!-- Leaf falling / on the ground -->
  <g transform="translate(150, 250) rotate(-60 150 150)">
    <!-- Thin dry stem -->
    <path d="M150 0 L150 50" stroke="#78350F" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Dead Brown Leaf, very shriveled -->
    <path d="M150 50 C180 60, 230 160, 140 350 C0 160, 60 60, 150 50 Z" fill="#92400E" />
    <path d="M150 50 Q170 70 160 100 Q180 130 170 160 Q200 200 160 250 Q180 300 140 350" fill="none" stroke="#451A03" stroke-width="8" stroke-linejoin="round"/>
    <path d="M150 50 Q130 70 140 100 Q120 130 130 160 Q100 200 140 250 Q120 300 140 350" fill="none" stroke="#451A03" stroke-width="8" stroke-linejoin="round"/>
    
    <path d="M150 50 Q140 200 140 330" stroke="#451A03" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M145 100 L160 120" stroke="#451A03" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M145 150 L110 170" stroke="#451A03" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Motion lines -->
  <path d="M260 60 Q240 150 200 220" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="10 10"/>
</svg>
