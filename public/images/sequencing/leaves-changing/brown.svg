<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 0 L512 0 L512 512 L0 512 Z" fill="#BAE6FD" />
  
  <g transform="translate(100, 50)">
    <!-- Thin dry stem -->
    <path d="M200 0 L180 50" stroke="#78350F" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 2"/>
    
    <!-- Dead Brown Leaf, very shriveled -->
    <path d="M180 50 C210 60, 260 160, 170 350 C30 160, 90 60, 180 50 Z" fill="#92400E" />
    <!-- Crinkly edges -->
    <path d="M180 50 Q200 70 190 100 Q210 130 200 160 Q230 200 190 250 Q210 300 170 350" fill="none" stroke="#451A03" stroke-width="8" stroke-linejoin="round"/>
    <path d="M180 50 Q160 70 170 100 Q150 130 160 160 Q130 200 170 250 Q150 300 170 350" fill="none" stroke="#451A03" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Veins -->
    <path d="M180 50 Q170 200 170 330" stroke="#451A03" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M175 100 L190 120" stroke="#451A03" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M170 150 L140 170" stroke="#451A03" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M170 200 L190 220" stroke="#451A03" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M170 250 L140 270" stroke="#451A03" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
