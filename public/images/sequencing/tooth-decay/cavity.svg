<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 0 L512 0 L512 512 L0 512 Z" fill="#F1F5F9" />
  
  <g transform="translate(256, 256)">
    <!-- Tooth with a small hole -->
    <path d="M-100 -120 C-100 -200, -50 -200, 0 -180 C50 -200, 100 -200, 100 -120 C100 -30, 80 50, 60 150 C50 200, 10 200, 0 150 C-10 100, -10 100, 0 150 C-10 200, -50 200, -60 150 C-80 50, -100 -30, -100 -120 Z" fill="#FEF3C7" stroke="#94A3B8" stroke-width="12" stroke-linejoin="round"/>
    
    <path d="M20 -180 C80 -180, 100 -100, 80 -40 C50 -60, 40 -120, 20 -180 Z" fill="#FDE047" opacity="0.9"/>
    <path d="M-90 -100 C-50 -80, -30 -20, -70 20 C-90 -10, -100 -50, -90 -100 Z" fill="#FDE047" opacity="0.9"/>
    
    <!-- Small Cavity Hole -->
    <circle cx="50" cy="-120" r="15" fill="#1E293B" />
    <path d="M50 -120 L30 -140 M50 -120 L70 -100 M50 -120 L40 -100" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Sick/Sad Face -->
    <path d="M-45 -80 Q-35 -90 -25 -80" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M25 -80 Q35 -90 45 -80" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Trembling mouth -->
    <path d="M-20 -30 Q0 -40 20 -30" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
