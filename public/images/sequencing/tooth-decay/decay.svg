    <path d="M25 -90 L45 -80" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Closed tight eyes -->
    <path d="M-45 -70 L-25 -70" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M25 -70 L45 -70" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <path d="M-20 -20 Q0 10 20 -20" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
