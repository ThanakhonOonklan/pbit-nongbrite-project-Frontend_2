<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Water background -->
  <rect width="512" height="512" rx="40" fill="#7DD3FC" opacity="0.25"/>
  <!-- Water bubbles -->
  <circle cx="100" cy="400" r="12" fill="white" opacity="0.2"/>
  <circle cx="120" cy="370" r="8" fill="white" opacity="0.15"/>
  <circle cx="400" cy="380" r="10" fill="white" opacity="0.18"/>
  <circle cx="380" cy="420" r="6" fill="white" opacity="0.12"/>
  <!-- Water ripples -->
  <path d="M60 440 Q120 425 180 440 Q240 455 300 440 Q360 425 420 440 Q450 450 460 445" stroke="white" stroke-width="2" fill="none" opacity="0.12"/>

  <!-- Veliger Larva body -->
  <g transform="translate(0, 20)">
    <!-- Soft body glow -->
    <ellipse cx="256" cy="270" rx="80" ry="70" fill="#FBCFE8" opacity="0.3"/>

    <!-- Shell forming (translucent, pearly) -->
    <path d="M256 320 C190 320, 170 260, 195 225 C220 195, 292 195, 317 225 C342 260, 322 320, 256 320 Z" fill="white" opacity="0.85"/>
    <path d="M256 320 C190 320, 170 260, 195 225 C220 195, 292 195, 317 225 C342 260, 322 320, 256 320 Z" fill="none" stroke="#F9A8D4" stroke-width="4"/>
    <!-- Shell shine -->
    <ellipse cx="230" cy="250" rx="20" ry="12" fill="white" opacity="0.5" transform="rotate(-15 230 250)"/>
    <!-- Shell growth lines -->
    <path d="M220 300 Q256 285 292 300" stroke="#F9A8D4" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M210 280 Q256 260 302 280" stroke="#F9A8D4" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Velum (swimming crown - fluffy, vibrant) -->
    <path d="M195 210 Q170 155 210 130 Q240 115 256 145 Q272 115 302 130 Q342 155 317 210" fill="#FBCFE8" stroke="#F472B6" stroke-width="3"/>
    <!-- Velum inner highlight -->
    <path d="M210 200 Q185 165 220 145 Q245 135 256 155 Q267 135 292 145 Q327 165 302 200" fill="#FCE7F3" opacity="0.7"/>

    <!-- Cilia (vibrant, animated feel) -->
    <g stroke="#F472B6" stroke-width="3.5" stroke-linecap="round" opacity="0.7">
      <line x1="178" y1="175" x2="155" y2="158"/>
      <line x1="185" y1="155" x2="168" y2="132"/>
      <line x1="200" y1="140" x2="188" y2="112"/>
      <line x1="220" y1="132" x2="215" y2="105"/>
      <line x1="334" y1="175" x2="357" y2="158"/>
      <line x1="327" y1="155" x2="344" y2="132"/>
      <line x1="312" y1="140" x2="324" y2="112"/>
      <line x1="292" y1="132" x2="297" y2="105"/>
    </g>
    <!-- Cilia tips (dots) -->
    <g fill="#F472B6" opacity="0.5">
      <circle cx="155" cy="155" r="4"/>
      <circle cx="168" cy="129" r="3.5"/>
      <circle cx="188" cy="109" r="3"/>
      <circle cx="215" cy="102" r="3"/>
      <circle cx="357" cy="155" r="4"/>
      <circle cx="344" cy="129" r="3.5"/>
      <circle cx="324" cy="109" r="3"/>
      <circle cx="297" cy="102" r="3"/>
    </g>

    <!-- Cute face -->
    <!-- Eyes -->
    <circle cx="238" cy="255" r="10" fill="#1E293B"/>
    <circle cx="274" cy="255" r="10" fill="#1E293B"/>
    <circle cx="241" cy="252" r="4" fill="white"/>
    <circle cx="277" cy="252" r="4" fill="white"/>
    <!-- Tiny smile -->
    <path d="M246 275 Q256 285 266 275" stroke="#F472B6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="225" cy="272" rx="12" ry="6" fill="#F9A8D4" opacity="0.4"/>
    <ellipse cx="287" cy="272" rx="12" ry="6" fill="#F9A8D4" opacity="0.4"/>
  </g>
</svg>
