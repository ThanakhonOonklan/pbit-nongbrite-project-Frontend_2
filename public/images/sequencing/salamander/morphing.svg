<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Half water / half land -->
  <path d="M0 350 L512 350 L512 512 L0 512 Z" fill="#0EA5E9" opacity="0.2" />
  <path d="M0 350 Q128 360 256 350 T512 350" stroke="#38BDF8" stroke-width="4" fill="none" />
  
  <!-- Rock/Bank coming out of water -->
  <path d="M50 512 C100 400, 200 300, 400 350 L512 380 L512 512 Z" fill="#6B7280" />
  <path d="M150 400 C200 320, 300 320, 450 380 L512 400 L512 512 L150 512 Z" fill="#4B5563" />
  
  <!-- Morphing Salamander (Crawling out of water) -->
  <!-- Half submerged -->
  <g transform="translate(10, -20)">
    <!-- Tail (Fin mostly gone) -->
    <path d="M150 380 C100 380, 50 420, 80 440" stroke="#1F2937" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- Back Leg (in water) -->
    <path d="M170 380 Q150 420 180 440" stroke="#1F2937" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Body -->
    <path d="M150 380 C200 320, 250 320, 300 360" stroke="#1F2937" stroke-width="40" fill="none" stroke-linecap="round"/>
    
    <!-- Front Leg (on rock) -->
    <path d="M280 340 Q300 380 330 380" stroke="#1F2937" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M330 380 L345 375 M330 380 L350 385 M330 380 L345 395" stroke="#1F2937" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Head (on rock) -->
    <ellipse cx="320" cy="340" rx="35" ry="25" fill="#1F2937" transform="rotate(15 320 340)"/>
    
    <!-- Yellow spots appearing -->
    <circle cx="280" cy="335" r="5" fill="#FDE047" />
    <circle cx="250" cy="345" r="6" fill="#FDE047" />
    <circle cx="220" cy="355" r="4" fill="#FDE047" />
    <circle cx="190" cy="365" r="5" fill="#FDE047" />
    
    <!-- Shrinking Gills (Just tiny nubs left) -->
    <path d="M300 325 Q280 310 270 320" stroke="#BE185D" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M295 335 Q280 330 270 340" stroke="#BE185D" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Eye -->
    <circle cx="330" cy="330" r="8" fill="#000000" />
    <circle cx="332" cy="328" r="2" fill="#FFFFFF" />
  </g>
</svg>
