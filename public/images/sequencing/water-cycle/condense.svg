<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <path d="M0 0 L512 0 L512 512 L0 512 Z" fill="#7DD3FC" />
  
  <!-- Vapor turning into small clouds -->
  <!-- Left cloud forming -->
  <path d="M150 300 Q120 300 120 270 Q120 230 160 230 Q170 180 220 200 Q250 210 250 250 Q250 290 200 300 Z" fill="#FFFFFF" opacity="0.7"/>
  <!-- Vapor feeding into left cloud -->
  <path d="M180 400 Q160 350 180 300" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="10 10" fill="none" opacity="0.5"/>
  
  <!-- Right cloud forming -->
  <path d="M350 250 Q320 250 320 220 Q320 180 360 180 Q370 130 420 150 Q450 160 450 200 Q450 240 400 250 Z" fill="#FFFFFF" opacity="0.8"/>
  <!-- Vapor feeding into right cloud -->
  <path d="M380 350 Q360 300 380 250" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="10 10" fill="none" opacity="0.5"/>
  
  <!-- Particles bunching up -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="180" cy="320" r="5" />
    <circle cx="160" cy="310" r="4" />
    <circle cx="200" cy="310" r="6" />
    <circle cx="370" cy="270" r="5" />
    <circle cx="390" cy="260" r="6" />
  </g>
</svg>
