<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ── CUTTING BOARD ── -->
  <rect x="20" y="130" width="160" height="25" rx="8" fill="#D7CCC8" stroke="#8D6E63" stroke-width="3"/>
  <rect x="20" y="130" width="160" height="15" rx="8" fill="#EFEBE9"/>

  <!-- ── ORANGE HALF (Face down) ── -->
  <path d="M45,135 A35,35 0 0,1 115,135 Z" fill="#FF9800" stroke="#E65100" stroke-width="2.5"/>
  <ellipse cx="80" cy="135" rx="35" ry="8" fill="#FF9800"/>

  <!-- ── ORANGE SLICES (Face up) ── -->
  <ellipse cx="140" cy="130" rx="30" ry="15" fill="#FP9800" stroke="#FFCC80" stroke-width="4"/>
  <ellipse cx="140" cy="130" rx="28" ry="13" fill="#FFF3E0"/>
  
  <!-- Outer orange rind edge -->
  <path d="M110,130 A30,15 0 0,0 170,130" fill="none" stroke="#FF9800" stroke-width="5"/>
  <path d="M110,130 A30,15 0 0,0 170,130" fill="none" stroke="#E65100" stroke-width="2"/>

  <!-- Segments -->
  <path d="M140,117 L140,143 M112,130 L168,130 M120,120 L160,140 M120,140 L160,120" stroke="#FFF3E0" stroke-width="2.5"/>
  
  <!-- Fleshy juicy parts -->
  <path d="M142,120 A10,4 0 0,1 156,126 L142,128 Z" fill="#FFB74D"/>
  <path d="M124,126 A10,4 0 0,1 138,120 L138,128 Z" fill="#FFB74D"/>
  <path d="M124,134 A10,4 0 0,0 138,140 L138,132 Z" fill="#FFB74D"/>
  <path d="M142,140 A10,4 0 0,0 156,134 L142,132 Z" fill="#FFB74D"/>

  <!-- ── KNIFE ── -->
  <rect x="35" y="45" width="20" height="50" rx="4" fill="#5D4037" stroke="#3E2000" stroke-width="2" transform="rotate(-30,55,70)"/> <!-- Handle -->
  <circle cx="50" cy="55" r="2.5" fill="#BCAAA4" transform="rotate(-30,55,70)"/>
  <circle cx="50" cy="65" r="2.5" fill="#BCAAA4" transform="rotate(-30,55,70)"/>
  
  <!-- Blade -->
  <path d="M60,82 L100,140 C100,140 105,145 110,140 L115,100 C110,80 60,82 60,82 Z" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="2"/>
  <path d="M100,140 L115,100" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/> <!-- Edge shine -->

  <!-- ── HAND (holding knife) ── -->
  <!-- Fingers wrapped around handle -->
  <rect x="40" y="45" width="28" height="12" rx="6" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(-20,40,45)"/>
  <rect x="45" y="55" width="28" height="12" rx="6" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(-20,45,55)"/>
  <rect x="50" y="65" width="28" height="12" rx="6" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(-20,50,65)"/>
  <rect x="55" y="75" width="28" height="12" rx="6" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(-20,55,75)"/>
  
  <rect x="20" y="30" width="30" height="40" rx="15" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/> <!-- Hand back -->

  <!-- Cut motion lines -->
  <path d="M90,75 L120,105" fill="none" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M80,85 L110,115" fill="none" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
