<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ── ORANGE (Peeled base) ── -->
  <circle cx="100" cy="110" r="38" fill="#FFF3E0" stroke="#FFCC80" stroke-width="3"/>
  
  <!-- Segments lines on pith -->
  <path d="M100,72 L100,148 M75,85 L125,135 M75,135 L125,85" stroke="#FFE0B2" stroke-width="2.5"/>

  <!-- Unpeeled skin bottom/left -->
  <path d="M62,110 A38,38 0 0,0 135,125 L140,140 A45,45 0 0,1 55,120 Z" fill="#FF9800" stroke="#E65100" stroke-width="2.5"/>
  <path d="M100,148 A38,38 0 0,0 138,105 L150,110 A48,48 0 0,1 100,160 Z" fill="#FF9800" stroke="#E65100" stroke-width="2.5"/>

  <!-- ── PEELING STRIP (Top right) ── -->
  <!-- Falling strip of orange peel -->
  <path d="M110,75 C130,50 160,80 145,110" fill="none" stroke="#FF9800" stroke-width="14" stroke-linecap="round"/>
  <path d="M110,75 C130,50 160,80 145,110" fill="none" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>

  <!-- Inner white of the peel strip -->
  <path d="M115,75 C130,55 152,80 140,105" fill="none" stroke="#FFF3E0" stroke-width="6" stroke-linecap="round"/>

  <!-- ── HANDS ── -->
  <!-- Left hand holding bottom -->
  <rect x="55" y="135" width="40" height="20" rx="10" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(-30,75,145)"/>
  <rect x="50" y="125" width="20" height="15" rx="7.5" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(-10,60,132)"/>
  
  <!-- Right hand pulling peel -->
  <rect x="140" y="55" width="40" height="20" rx="10" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5" transform="rotate(30,160,65)"/>
  <rect x="135" y="70" width="18" height="14" rx="7" fill="#FFCD94" stroke="#D4885A" stroke-width="2.5"/> <!-- Thumb pressing peel -->
  
  <!-- Motion line -->
  <path d="M125,50 C145,30 170,40 180,60" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M175,50 L180,60 L170,62" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round"/>
</svg>
