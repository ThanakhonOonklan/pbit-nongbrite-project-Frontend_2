<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Half water, half air -->
  <path d="M0 256 L512 256 L512 512 L0 512 Z" fill="#0EA5E9" opacity="0.2" />
  <!-- Water surface line -->
  <path d="M0 256 Q128 266 256 256 T512 256" stroke="#38BDF8" stroke-width="4" fill="none" />
  
  <!-- Reed/Stick coming out of water -->
  <path d="M256 512 C240 400, 270 200, 256 0" stroke="#B45309" stroke-width="30" fill="none" />
  <path d="M256 512 C240 400, 270 200, 256 0" stroke="#92400E" stroke-width="15" fill="none" />
  
  <!-- Nymph climbing out (Above water) -->
  <g transform="translate(0, -60)">
    <!-- Legs gripping stick -->
    <path d="M240 200 L210 180 L230 150 M240 240 L190 230 L220 200 M240 280 L200 300 L230 280" stroke="#4B5563" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M272 200 L302 180 L282 150 M272 240 L322 230 L292 200 M272 280 L312 300 L282 280" stroke="#4B5563" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Body -->
    <path d="M256 200 C290 200, 280 320, 256 360 C232 320, 222 200, 256 200 Z" fill="#6B7280" />
    <path d="M230 250 Q256 260 282 250 M230 280 Q256 290 282 280 M235 310 Q256 320 277 310" stroke="#374151" stroke-width="4" fill="none" />
    
    <ellipse cx="256" cy="180" rx="25" ry="30" fill="#6B7280" />
    <ellipse cx="256" cy="130" rx="35" ry="25" fill="#4B5563" />
    
    <circle cx="225" cy="120" r="12" fill="#111827" />
    <circle cx="287" cy="120" r="12" fill="#111827" />
  </g>
</svg>
