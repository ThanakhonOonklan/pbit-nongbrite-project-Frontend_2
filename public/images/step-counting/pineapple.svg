<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Body gradient -->
    <radialGradient id="pineBody" cx="32%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#FFE566" />
      <stop offset="50%"  stop-color="#EFA800" />
      <stop offset="100%" stop-color="#B87200" />
    </radialGradient>
    <!-- Sheen on left side -->
    <radialGradient id="pineHL" cx="28%" cy="30%" r="38%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <!-- Leaf gradient -->
    <linearGradient id="leafG" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#276E00" />
      <stop offset="100%" stop-color="#7DC83A" />
    </linearGradient>
    <!-- Clip to oval body -->
    <clipPath id="pineClip">
      <ellipse cx="60" cy="76" rx="27" ry="33" />
    </clipPath>
    <!-- Diamond scale pattern -->
    <pattern id="scales" x="0" y="0" width="13" height="10" patternUnits="userSpaceOnUse">
      <path d="M6.5 0 L13 5 L6.5 10 L0 5 Z"
            fill="none" stroke="#8B5E00" stroke-width="1.1" stroke-linejoin="round" />
    </pattern>
  </defs>

  <!-- Shadow -->
  <ellipse cx="60" cy="108" rx="28" ry="7" fill="#000" opacity="0.1" />

  <!-- Body -->
  <ellipse cx="60" cy="76" rx="27" ry="33" fill="url(#pineBody)" />

  <!-- Scale pattern -->
  <rect x="30" y="40" width="60" height="72"
        fill="url(#scales)" clip-path="url(#pineClip)" opacity="0.65" />

  <!-- Highlight -->
  <ellipse cx="60" cy="76" rx="27" ry="33" fill="url(#pineHL)" />

  <!-- ── Crown ── -->
  <!-- Back leaves (drawn first so they sit behind) -->
  <path d="M60 44 C55 34 48 20 44 10 C50 22 56 34 60 44 Z"
        fill="#3B8A1A" opacity="0.7" />
  <path d="M60 44 C65 34 72 20 76 10 C70 22 64 34 60 44 Z"
        fill="#3B8A1A" opacity="0.7" />
  <path d="M60 44 C50 38 36 30 28 28 C38 30 50 38 60 44 Z"
        fill="#3B8A1A" opacity="0.6" />
  <path d="M60 44 C70 38 84 30 92 28 C82 30 70 38 60 44 Z"
        fill="#3B8A1A" opacity="0.6" />

  <!-- Front leaves (on top) -->
  <path d="M60 44 C59 30 57 14 60 3 C63 14 61 30 60 44 Z"
        fill="url(#leafG)" />
  <path d="M60 44 C53 30 44 14 40 6 C47 17 54 31 60 44 Z"
        fill="url(#leafG)" />
  <path d="M60 44 C67 30 76 14 80 6 C73 17 66 31 60 44 Z"
        fill="url(#leafG)" />

  <!-- Leaf veins -->
  <line x1="60" y1="44" x2="60" y2="4"  stroke="#1C5200" stroke-width="1" opacity="0.5" stroke-linecap="round" />
  <line x1="60" y1="44" x2="41" y2="7"  stroke="#1C5200" stroke-width="1" opacity="0.4" stroke-linecap="round" />
  <line x1="60" y1="44" x2="79" y2="7"  stroke="#1C5200" stroke-width="1" opacity="0.4" stroke-linecap="round" />
</svg>
