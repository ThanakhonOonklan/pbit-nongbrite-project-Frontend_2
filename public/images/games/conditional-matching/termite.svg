  <!-- Leg feet -->
  <circle cx="37" cy="94" r="1.5" fill="#B8956A"/>
  <circle cx="47" cy="96" r="1.5" fill="#B8956A"/>
  <circle cx="59" cy="96" r="1.5" fill="#B8956A"/>
  <circle cx="75" cy="96" r="1.5" fill="#B8956A"/>
  <circle cx="87" cy="96" r="1.5" fill="#B8956A"/>
