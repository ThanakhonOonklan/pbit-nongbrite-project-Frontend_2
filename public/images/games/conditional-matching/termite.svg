  <path d="M46 78 Q42 88 38 94" stroke="#C4A070" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M54 80 Q52 90 48 96" stroke="#C4A070" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M66 80 Q64 90 60 96" stroke="#C4A070" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M78 80 Q78 90 76 96" stroke="#C4A070" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M88 82 Q90 90 88 96" stroke="#C4A070" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M96" cy="80" fill="none"/>
