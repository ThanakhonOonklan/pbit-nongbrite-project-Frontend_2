  <path d="M34 63 C42 60 50 60 56 63" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M75 63 C82 60 90 60 96 63" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Done check -->
  <circle cx="99" cy="35" r="14" fill="#66BB6A"/>
  <path d="M92 35 L97 40 L107 29" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
