<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Soft background circle -->
  <circle cx="64" cy="54" r="56" fill="#FFF3E0" opacity="0.4"/>
  <!-- Head -->
  <circle cx="64" cy="44" r="30" fill="#FFCCAB"/>
  <!-- Ears -->
  <ellipse cx="34" cy="44" rx="6" ry="8" fill="#FFCCAB"/>
  <ellipse cx="34" cy="44" rx="4" ry="6" fill="#FFB98A"/>
  <ellipse cx="94" cy="44" rx="6" ry="8" fill="#FFCCAB"/>
  <ellipse cx="94" cy="44" rx="4" ry="6" fill="#FFB98A"/>
  <!-- Hair (fluffy, thinning on top) -->
  <path d="M34 38 Q34 12 64 8 Q94 12 94 38" fill="#6D4C41"/>
  <path d="M38 36 Q38 16 64 12 Q90 16 90 36" fill="#795548"/>
  <!-- Hair shine -->
  <ellipse cx="54" cy="18" rx="8" ry="4" fill="#8D6E63" opacity="0.5"/>
  <!-- Thinning spots (scalp showing) -->
  <ellipse cx="58" cy="20" rx="5" ry="3.5" fill="#FFCCAB" opacity="0.5"/>
  <ellipse cx="74" cy="18" rx="4" ry="3" fill="#FFCCAB" opacity="0.4"/>
  <!-- Eyes (cute worried) -->
  <ellipse cx="52" cy="42" rx="7" ry="8" fill="white"/>
  <circle cx="53" cy="44" r="5" fill="#4E342E"/>
  <circle cx="55" cy="42" r="2" fill="white"/>
  <ellipse cx="76" cy="42" rx="7" ry="8" fill="white"/>
  <circle cx="77" cy="44" r="5" fill="#4E342E"/>
  <circle cx="79" cy="42" r="2" fill="white"/>
  <!-- Worried eyebrows -->
  <path d="M44 32 Q52 28 60 33" fill="none" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M68 33 Q76 28 84 32" fill="none" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="42" cy="52" rx="6" ry="3.5" fill="#FFAB91" opacity="0.45"/>
  <ellipse cx="86" cy="52" rx="6" ry="3.5" fill="#FFAB91" opacity="0.45"/>
  <!-- Worried mouth -->
  <path d="M56 58 Q64 54 72 58" fill="none" stroke="#BF7B5E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Falling hair - graceful curves -->
  <path d="M40 52 Q34 66 28 82" stroke="#795548" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M44 56 Q40 72 36 90" stroke="#6D4C41" stroke-width="1.8" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M88 50 Q94 64 100 80" stroke="#795548" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M84 54 Q90 70 96 88" stroke="#6D4C41" stroke-width="1.8" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M58 64 Q52 78 46 94" stroke="#795548" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round"/>
  <path d="M72 62 Q78 76 84 92" stroke="#795548" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round"/>
  <!-- Hair on floor - soft curls -->
  <path d="M16 104 Q24 98 32 104 Q36 108 30 108" stroke="#795548" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M42 108 Q52 102 60 108 Q64 112 56 110" stroke="#6D4C41" stroke-width="1.8" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M70 106 Q80 100 90 106 Q94 110 86 108" stroke="#795548" stroke-width="1.8" fill="none" opacity="0.45" stroke-linecap="round"/>
  <path d="M96 110 Q104 104 112 110" stroke="#6D4C41" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <!-- Sparkle tears (cute sad) -->
  <path d="M46 56 Q44 62 46 66" stroke="#80DEEA" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
