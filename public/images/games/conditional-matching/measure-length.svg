<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Object being measured (pencil) -->
  <rect x="22" y="36" width="84" height="12" rx="2" fill="#FFD93D"/>
  <polygon points="106,36 106,48 118,42" fill="#F5C89A"/>
  <!-- Pencil tip -->
  <polygon points="114,39 114,45 120,42" fill="#2C1810"/>
  <!-- Pencil eraser -->
  <rect x="16" y="37" width="8" height="10" rx="2" fill="#FF8FA0"/>
  <!-- Pencil metal band -->
  <rect x="22" y="37" width="4" height="10" fill="#C0C0C0"/>
  <!-- Pencil line -->
  <line x1="28" y1="42" x2="106" y2="42" stroke="#E8C030" stroke-width="0.8" opacity="0.5"/>

  <!-- Ruler below -->
  <rect x="14" y="62" width="100" height="20" rx="3" fill="#5BB5E8"/>
  <!-- Ruler edge -->
  <rect x="14" y="62" width="100" height="20" rx="3" fill="none" stroke="#4A9AD4" stroke-width="1.5"/>

  <!-- Ruler markings -->
  <line x1="24" y1="62" x2="24" y2="72" stroke="white" stroke-width="1.5"/>
  <line x1="34" y1="62" x2="34" y2="68" stroke="white" stroke-width="1"/>
  <line x1="44" y1="62" x2="44" y2="72" stroke="white" stroke-width="1.5"/>
  <line x1="54" y1="62" x2="54" y2="68" stroke="white" stroke-width="1"/>
  <line x1="64" y1="62" x2="64" y2="72" stroke="white" stroke-width="1.5"/>
  <line x1="74" y1="62" x2="74" y2="68" stroke="white" stroke-width="1"/>
  <line x1="84" y1="62" x2="84" y2="72" stroke="white" stroke-width="1.5"/>
  <line x1="94" y1="62" x2="94" y2="68" stroke="white" stroke-width="1"/>
  <line x1="104" y1="62" x2="104" y2="72" stroke="white" stroke-width="1.5"/>

  <!-- Numbers on ruler -->
  <text x="23" y="80" font-family="Arial" font-size="7" fill="white" text-anchor="middle">0</text>
  <text x="44" y="80" font-family="Arial" font-size="7" fill="white" text-anchor="middle">1</text>
  <text x="64" y="80" font-family="Arial" font-size="7" fill="white" text-anchor="middle">2</text>
  <text x="84" y="80" font-family="Arial" font-size="7" fill="white" text-anchor="middle">3</text>
  <text x="104" y="80" font-family="Arial" font-size="7" fill="white" text-anchor="middle">4</text>

  <!-- Double-headed arrow showing measurement -->
  <line x1="22" y1="92" x2="108" y2="92" stroke="#FF6B6B" stroke-width="2"/>
  <polygon points="22,88 22,96 14,92" fill="#FF6B6B"/>
  <polygon points="108,88 108,96 116,92" fill="#FF6B6B"/>

  <!-- Measurement label -->
  <text x="64" y="106" font-family="Arial" font-size="10" font-weight="bold" fill="#FF6B6B" text-anchor="middle">?</text>
</svg>
