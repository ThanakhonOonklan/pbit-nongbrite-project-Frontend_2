<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Camera body -->
  <rect x="16" y="40" width="96" height="64" rx="12" fill="#78909C"/>
  <rect x="16" y="40" width="96" height="64" rx="12" fill="none" stroke="#546E7A" stroke-width="2"/>
  <!-- Top bump (viewfinder area) -->
  <rect x="44" y="28" width="40" height="16" rx="6" fill="#607D8B"/>
  <!-- Flash -->
  <rect x="24" y="32" width="14" height="10" rx="3" fill="#455A64"/>
  <rect x="26" y="34" width="10" height="6" rx="2" fill="#FFF9C4" opacity="0.6"/>
  <!-- Lens outer ring -->
  <circle cx="64" cy="72" r="22" fill="#37474F"/>
  <circle cx="64" cy="72" r="20" fill="#455A64"/>
  <!-- Lens inner rings -->
  <circle cx="64" cy="72" r="16" fill="#546E7A"/>
  <circle cx="64" cy="72" r="12" fill="#263238"/>
  <circle cx="64" cy="72" r="8" fill="#37474F"/>
  <!-- Lens reflection -->
  <circle cx="64" cy="72" r="6" fill="#42A5F5" opacity="0.3"/>
  <ellipse cx="58" cy="66" rx="4" ry="3" fill="white" opacity="0.35"/>
  <circle cx="70" cy="78" r="2" fill="white" opacity="0.2"/>
  <!-- Shutter button -->
  <circle cx="88" cy="34" r="6" fill="#EF5350"/>
  <circle cx="88" cy="34" r="4" fill="#E53935"/>
  <circle cx="87" cy="33" r="1.5" fill="white" opacity="0.4"/>
  <!-- Mode dial -->
  <circle cx="98" cy="48" r="4" fill="#455A64"/>
  <circle cx="98" cy="48" r="2.5" fill="#546E7A"/>
  <!-- Brand strip -->
  <rect x="40" y="44" width="48" height="3" rx="1.5" fill="#546E7A" opacity="0.5"/>
  <!-- Camera strap holes -->
  <circle cx="22" cy="48" r="2.5" fill="#455A64"/>
  <circle cx="106" cy="48" r="2.5" fill="#455A64"/>
</svg>
