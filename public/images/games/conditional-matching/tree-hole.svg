<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E8F4F8"/>
  <path d="M 0 80 Q 50 70 100 80 L 100 100 L 0 100 Z" fill="#84CC16"/>
  <!-- Tree trunk -->
  <rect x="35" y="-10" width="30" height="100" fill="#8B4513"/>
  <!-- Roots -->
  <path d="M 35 90 C 25 95, 20 100, 15 100 L 40 90 Z" fill="#8B4513"/>
  <path d="M 65 90 C 75 95, 80 100, 85 100 L 60 90 Z" fill="#8B4513"/>
  <path d="M 35 90 L 65 90 L 85 100 L 15 100 Z" fill="#8B4513"/>
  
  <!-- Bark lines -->
  <line x1="40" y1="0" x2="40" y2="30" stroke="#5C3A21" stroke-width="2"/>
  <line x1="60" y1="10" x2="60" y2="40" stroke="#5C3A21" stroke-width="2"/>
  <line x1="45" y1="65" x2="45" y2="90" stroke="#5C3A21" stroke-width="2"/>
  <line x1="55" y1="70" x2="55" y2="85" stroke="#5C3A21" stroke-width="2"/>
  
  <!-- Tree hole -->
  <ellipse cx="50" cy="50" rx="10" ry="16" fill="#1A1A1A"/>
  
  <!-- Acorn peeking out -->
  <path d="M 46 58 Q 50 52 54 58 Z" fill="#D97706"/>
  <path d="M 45 58 Q 50 62 55 58 Z" fill="#A16207"/>
  
  <!-- Leaves on ground -->
  <path d="M 20 85 Q 25 80 30 85 Z" fill="#65A30D"/>
  <path d="M 70 88 Q 75 83 80 88 Z" fill="#65A30D"/>
</svg>
