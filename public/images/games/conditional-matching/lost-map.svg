<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Folded map -->
  <g transform="rotate(-5 64 64)">
    <!-- Map paper - folded -->
    <path d="M18 28 L50 22 L82 28 L114 22 L114 100 L82 106 L50 100 L18 106 Z" fill="#E8F5E9"/>
    <path d="M50 22 L50 100" stroke="#C8E6C9" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M82 28 L82 106" stroke="#C8E6C9" stroke-width="1.5" stroke-dasharray="4 2"/>
    <!-- Map border -->
    <path d="M18 28 L50 22 L82 28 L114 22 L114 100 L82 106 L50 100 L18 106 Z" fill="none" stroke="#81C784" stroke-width="2"/>
    <!-- Land masses -->
    <ellipse cx="40" cy="50" rx="14" ry="10" fill="#A5D6A7"/>
    <ellipse cx="48" cy="58" rx="8" ry="12" fill="#81C784"/>
    <ellipse cx="90" cy="46" rx="12" ry="14" fill="#A5D6A7"/>
    <ellipse cx="85" cy="60" rx="10" ry="8" fill="#81C784"/>
    <ellipse cx="66" cy="80" rx="16" ry="8" fill="#A5D6A7"/>
    <!-- Water -->
    <path d="M55 44 Q60 40 65 44" stroke="#64B5F6" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M58 50 Q63 46 68 50" stroke="#64B5F6" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Roads -->
    <path d="M34 40 Q50 50 66 42 Q80 36 98 48" stroke="#FFF9C4" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M42 70 Q56 60 72 72 Q84 80 96 70" stroke="#FFF9C4" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Location pin -->
    <g transform="translate(70 34)">
      <path d="M0 -4 Q0 -14 -8 -14 Q-16 -14 -16 -4 Q-16 4 -8 14 Q0 4 0 -4 Z" fill="#EF5350"/>
      <circle cx="-8" cy="-6" r="4" fill="white"/>
    </g>
  </g>
  <!-- Question mark (lost!) -->
  <text x="102" y="24" font-family="Arial" font-size="20" font-weight="bold" fill="#EF5350" opacity="0.7" text-anchor="middle">?</text>
  <text x="22" y="114" font-family="Arial" font-size="16" font-weight="bold" fill="#EF5350" opacity="0.5" text-anchor="middle">?</text>
</svg>
