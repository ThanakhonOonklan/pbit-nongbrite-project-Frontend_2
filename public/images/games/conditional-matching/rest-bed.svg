<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Bed frame -->
  <rect x="14" y="60" width="100" height="40" rx="4" fill="#8B6E4E"/>
  <!-- Mattress -->
  <rect x="18" y="56" width="92" height="30" rx="6" fill="white"/>
  <!-- Blanket -->
  <rect x="18" y="62" width="92" height="28" rx="4" fill="#87CEEB"/>
  <rect x="18" y="62" width="92" height="28" rx="4" fill="none" stroke="#6BB8D8" stroke-width="1.5"/>
  <!-- Blanket pattern -->
  <path d="M30 70 Q42 68 54 70 Q66 72 78 70 Q90 68 102 70" stroke="#6BB8D8" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Pillow -->
  <ellipse cx="34" cy="54" rx="18" ry="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <ellipse cx="32" cy="52" rx="6" ry="4" fill="white" opacity="0.5"/>
  <!-- Head on pillow -->
  <circle cx="36" cy="46" r="14" fill="#FFD3B5"/>
  <!-- Hair -->
  <path d="M22 42 Q22 30 36 28 Q50 30 50 42" fill="#5C4033"/>
  <!-- Closed eyes (sleeping) -->
  <path d="M28 46 Q32 48 36 46" fill="none" stroke="#2C1810" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 46 Q42 48 46 46" fill="none" stroke="#2C1810" stroke-width="2" stroke-linecap="round"/>
  <!-- Peaceful smile -->
  <path d="M32 52 Q36 54 40 52" fill="none" stroke="#C08060" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <ellipse cx="28" cy="50" rx="3" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <ellipse cx="46" cy="50" rx="3" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <!-- Zzz -->
  <text x="60" y="34" font-family="Arial" font-size="14" font-weight="bold" fill="#7A9EC4" opacity="0.6">z</text>
  <text x="72" y="24" font-family="Arial" font-size="11" font-weight="bold" fill="#7A9EC4" opacity="0.45">z</text>
  <text x="80" y="16" font-family="Arial" font-size="8" font-weight="bold" fill="#7A9EC4" opacity="0.35">z</text>
  <!-- Bed legs -->
  <rect x="14" y="96" width="6" height="12" rx="2" fill="#6B5438"/>
  <rect x="108" y="96" width="6" height="12" rx="2" fill="#6B5438"/>
  <!-- Headboard -->
  <rect x="10" y="30" width="6" height="72" rx="3" fill="#8B6E4E"/>
  <!-- Footboard -->
  <rect x="112" y="50" width="6" height="52" rx="3" fill="#8B6E4E"/>
</svg>
