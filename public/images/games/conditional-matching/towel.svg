  <path d="M44 52 H60 M44 64 H66 M44 76 H58 M44 88 H64" stroke="#DDE4EA" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <path d="M78 54 H88 M78 68 H86 M78 82 H89" stroke="#DDE4EA" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

