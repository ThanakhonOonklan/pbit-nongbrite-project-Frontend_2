  <!-- Hanging bar -->
  <rect x="24" y="22" width="80" height="8" rx="4" fill="#90A4AE"/>
  <circle cx="32" cy="26" r="4" fill="#607D8B"/>
  <circle cx="96" cy="26" r="4" fill="#607D8B"/>

  <!-- Main towel body -->
  <path d="M34 30 H94 V93 Q94 104 84 104 H44 Q34 104 34 93 Z" fill="#FFFFFF"/>
  <path d="M34 30 H94 V43 H34 Z" fill="#F5F7FA"/>
  <path d="M34 30 H94 V93 Q94 104 84 104 H44 Q34 104 34 93 Z" fill="none" stroke="#B0BEC5" stroke-width="3" stroke-linejoin="round"/>

