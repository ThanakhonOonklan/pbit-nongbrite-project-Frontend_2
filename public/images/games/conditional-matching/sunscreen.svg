<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Bottle body -->
  <rect x="36" y="36" width="56" height="72" rx="10" fill="#FF8C42"/>
  <!-- Bottle cap -->
  <rect x="48" y="22" width="32" height="18" rx="4" fill="#FFB74D"/>
  <rect x="52" y="18" width="24" height="8" rx="3" fill="#FFD54F"/>
  <!-- Flip cap top -->
  <path d="M56 18 Q64 12 72 18" fill="#FFD54F"/>
  <!-- Label area -->
  <rect x="42" y="50" width="44" height="40" rx="4" fill="white" opacity="0.9"/>
  <!-- SPF text -->
  <text x="64" y="66" font-family="Arial" font-size="11" font-weight="bold" fill="#FF6B00" text-anchor="middle">SPF</text>
  <text x="64" y="82" font-family="Arial" font-size="14" font-weight="bold" fill="#FF6B00" text-anchor="middle">50+</text>
  <!-- Sun icon on bottle -->
  <circle cx="64" cy="46" r="4" fill="#FFD54F"/>
  <line x1="64" y1="40" x2="64" y2="38" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="42" x2="56" y2="40" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="42" x2="72" y2="40" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cream squirt -->
  <path d="M72 24 Q82 20 86 28 Q88 34 82 36" fill="#FFF8E0" stroke="#F0E0C0" stroke-width="1"/>
  <circle cx="84" cy="38" r="4" fill="#FFF8E0"/>
</svg>
