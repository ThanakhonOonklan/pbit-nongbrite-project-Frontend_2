<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Window frame -->
  <rect x="14" y="14" width="100" height="100" rx="6" fill="#90CAF9" stroke="#5C6BC0" stroke-width="3"/>
  <!-- Window panes -->
  <line x1="64" y1="14" x2="64" y2="114" stroke="#5C6BC0" stroke-width="3"/>
  <line x1="14" y1="64" x2="114" y2="64" stroke="#5C6BC0" stroke-width="3"/>
  <!-- Sky color behind -->
  <rect x="16" y="16" width="46" height="46" fill="#64B5F6"/>
  <rect x="66" y="16" width="46" height="46" fill="#64B5F6"/>
  <rect x="16" y="66" width="46" height="46" fill="#64B5F6"/>
  <rect x="66" y="66" width="46" height="46" fill="#64B5F6"/>
  <!-- Fog/haze overlay -->
  <rect x="16" y="16" width="46" height="46" fill="white" opacity="0.55"/>
  <rect x="66" y="16" width="46" height="46" fill="white" opacity="0.6"/>
  <rect x="16" y="66" width="46" height="46" fill="white" opacity="0.5"/>
  <rect x="66" y="66" width="46" height="46" fill="white" opacity="0.65"/>
  <!-- Fog streaks -->
  <ellipse cx="40" cy="36" rx="18" ry="6" fill="white" opacity="0.5"/>
  <ellipse cx="88" cy="44" rx="16" ry="5" fill="white" opacity="0.45"/>
  <ellipse cx="38" cy="82" rx="20" ry="7" fill="white" opacity="0.4"/>
  <ellipse cx="90" cy="78" rx="18" ry="6" fill="white" opacity="0.5"/>
  <ellipse cx="64" cy="56" rx="22" ry="5" fill="white" opacity="0.35"/>
  <!-- Water droplets on glass -->
  <ellipse cx="28" cy="28" rx="2.5" ry="3" fill="#B3D9F7" opacity="0.6"/>
  <ellipse cx="48" cy="48" rx="2" ry="2.5" fill="#B3D9F7" opacity="0.5"/>
  <ellipse cx="78" cy="32" rx="2" ry="3" fill="#B3D9F7" opacity="0.55"/>
  <ellipse cx="98" cy="52" rx="2.5" ry="3" fill="#B3D9F7" opacity="0.5"/>
  <ellipse cx="30" cy="76" rx="2" ry="2.5" fill="#B3D9F7" opacity="0.5"/>
  <ellipse cx="52" cy="90" rx="2.5" ry="3" fill="#B3D9F7" opacity="0.45"/>
  <ellipse cx="82" cy="88" rx="2" ry="2.5" fill="#B3D9F7" opacity="0.5"/>
  <ellipse cx="100" cy="96" rx="2.5" ry="3" fill="#B3D9F7" opacity="0.4"/>
  <!-- Finger swipe mark -->
  <path d="M72 26 Q76 40 80 56" stroke="#64B5F6" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
