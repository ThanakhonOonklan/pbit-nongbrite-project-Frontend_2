<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#E8F4F8"/>
  
  <!-- Mountain/Rock behind -->
  <path d="M 5 100 L 35 25 L 60 45 L 85 100 Z" fill="#9CA3AF"/>
  <path d="M 30 100 L 60 15 L 100 100 Z" fill="#6B7280"/>
  
  <!-- Main Cave Rock -->
  <path d="M 10 100 C 10 30, 90 30, 90 100 Z" fill="#4B5563"/>
  <path d="M 20 100 C 20 45, 80 45, 80 100 Z" fill="#374151"/>
  
  <!-- Cave Entrance (Dark) -->
  <path d="M 35 100 C 35 60, 65 60, 65 100 Z" fill="#111827"/>
  
  <!-- Sleep Zzzs coming out -->
  <text x="40" y="55" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" opacity="0.9">Z</text>
  <text x="50" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF" opacity="0.7">z</text>
  <text x="60" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#FFFFFF" opacity="0.5">z</text>
  
  <!-- Some ground/grass in front -->
  <path d="M 0 100 C 20 90, 80 90, 100 100 Z" fill="#4ADE80"/>
  
  <!-- Small stones -->
  <circle cx="20" cy="95" r="3" fill="#9CA3AF"/>
  <circle cx="80" cy="97" r="4" fill="#6B7280"/>
</svg>
