<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Floor -->
  <rect x="8" y="60" width="112" height="58" rx="6" fill="#D7CCC8"/>
  <!-- Floor boards -->
  <line x1="8" y1="76" x2="120" y2="76" stroke="#BCAAA4" stroke-width="1" opacity="0.5"/>
  <line x1="8" y1="92" x2="120" y2="92" stroke="#BCAAA4" stroke-width="1" opacity="0.5"/>
  <line x1="8" y1="108" x2="120" y2="108" stroke="#BCAAA4" stroke-width="1" opacity="0.5"/>
  <!-- Dust particles floating -->
  <circle cx="30" cy="20" r="3" fill="#D7CCC8" opacity="0.6"/>
  <circle cx="50" cy="14" r="2.5" fill="#BCAAA4" opacity="0.5"/>
  <circle cx="76" cy="22" r="3.5" fill="#D7CCC8" opacity="0.55"/>
  <circle cx="96" cy="16" r="2" fill="#BCAAA4" opacity="0.45"/>
  <circle cx="40" cy="34" r="2.5" fill="#D7CCC8" opacity="0.5"/>
  <circle cx="64" cy="28" r="3" fill="#BCAAA4" opacity="0.4"/>
  <circle cx="88" cy="38" r="2.5" fill="#D7CCC8" opacity="0.5"/>
  <circle cx="20" cy="44" r="2" fill="#BCAAA4" opacity="0.45"/>
  <circle cx="104" cy="32" r="2" fill="#D7CCC8" opacity="0.4"/>
  <circle cx="58" cy="48" r="3" fill="#D7CCC8" opacity="0.35"/>
  <!-- Dust clouds on floor -->
  <ellipse cx="36" cy="72" rx="14" ry="4" fill="#BCAAA4" opacity="0.4"/>
  <ellipse cx="72" cy="80" rx="18" ry="5" fill="#BCAAA4" opacity="0.35"/>
  <ellipse cx="100" cy="70" rx="12" ry="3.5" fill="#BCAAA4" opacity="0.4"/>
  <ellipse cx="50" cy="96" rx="16" ry="4" fill="#BCAAA4" opacity="0.3"/>
  <ellipse cx="90" cy="100" rx="14" ry="3.5" fill="#BCAAA4" opacity="0.35"/>
  <!-- Dust bunny -->
  <circle cx="24" cy="86" r="6" fill="#A1887F" opacity="0.4"/>
  <circle cx="28" cy="84" r="4" fill="#A1887F" opacity="0.35"/>
  <circle cx="20" cy="88" r="3.5" fill="#A1887F" opacity="0.3"/>
  <!-- Sneeze/achoo indicator -->
  <text x="64" y="54" font-family="Arial" font-size="18" font-weight="bold" fill="#A1887F" opacity="0.5" text-anchor="middle">💨</text>
  <!-- Footprint outline in dust -->
  <ellipse cx="80" cy="106" rx="8" ry="4" fill="#C4B5A8" opacity="0.5"/>
  <ellipse cx="60" cy="112" rx="7" ry="3.5" fill="#C4B5A8" opacity="0.4"/>
</svg>
