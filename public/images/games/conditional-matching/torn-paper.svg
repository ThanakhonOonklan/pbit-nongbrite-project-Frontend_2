<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#FEE2E2"/>
  
  <g transform="translate(0, -2)">
    <!-- Top half of paper -->
    <path d="M 30 15 L 70 15 L 70 45 L 60 40 L 50 50 L 40 45 L 30 48 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Lines on top half -->
    <line x1="40" y1="25" x2="60" y2="25" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="35" x2="60" y2="35" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(-2, 4)">
    <!-- Bottom half of paper (shifted down and left) -->
    <path d="M 30 54 L 40 51 L 50 61 L 60 51 L 70 56 L 70 85 L 30 85 Z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Lines on bottom half -->
    <line x1="40" y1="65" x2="60" y2="65" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="75" x2="60" y2="75" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Tear motion lines / focus marks -->
  <path d="M 15 50 Q 25 45 25 55" stroke="#EF4444" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 85 50 Q 75 45 75 55" stroke="#EF4444" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
