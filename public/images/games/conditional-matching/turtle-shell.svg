<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Shell dome -->
  <ellipse cx="64" cy="72" rx="40" ry="30" fill="#6B8E50"/>
  <path d="M24 72 Q24 42 64 32 Q104 42 104 72" fill="#7AA05A"/>
  <!-- Shell pattern - hexagonal -->
  <path d="M64 34 L64 55" stroke="#5C7A42" stroke-width="2"/>
  <path d="M64 55 L44 45" stroke="#5C7A42" stroke-width="2"/>
  <path d="M64 55 L84 45" stroke="#5C7A42" stroke-width="2"/>
  <path d="M64 55 L50 72" stroke="#5C7A42" stroke-width="2"/>
  <path d="M64 55 L78 72" stroke="#5C7A42" stroke-width="2"/>
  <path d="M44 45 L30 58" stroke="#5C7A42" stroke-width="2"/>
  <path d="M84 45 L98 58" stroke="#5C7A42" stroke-width="2"/>
  <path d="M50 72 L30 72" stroke="#5C7A42" stroke-width="2"/>
  <path d="M78 72 L98 72" stroke="#5C7A42" stroke-width="2"/>
  <path d="M50 72 L54 88" stroke="#5C7A42" stroke-width="2"/>
  <path d="M78 72 L74 88" stroke="#5C7A42" stroke-width="2"/>
  <!-- Shell rim -->
  <ellipse cx="64" cy="80" rx="42" ry="14" fill="#8B6E4E"/>
  <ellipse cx="64" cy="78" rx="40" ry="12" fill="#A08060"/>
  <!-- Shell edge pattern -->
  <path d="M26 76 Q34 70 44 72 Q54 74 64 72 Q74 70 84 72 Q94 74 102 76" fill="none" stroke="#6B5438" stroke-width="1.5"/>
  <!-- Head peeking out slightly -->
  <ellipse cx="30" cy="80" rx="8" ry="6" fill="#7AAA5A" opacity="0.4"/>
  <!-- Tiny legs barely visible -->
  <ellipse cx="36" cy="88" rx="5" ry="3" fill="#7AAA5A" opacity="0.3"/>
  <ellipse cx="92" cy="88" rx="5" ry="3" fill="#7AAA5A" opacity="0.3"/>
  <!-- Tail tip -->
  <path d="M100 80 Q106 82 108 80" stroke="#7AAA5A" stroke-width="2" stroke-linecap="round" opacity="0.3" fill="none"/>
  <!-- Shell highlight -->
  <ellipse cx="52" cy="46" rx="10" ry="6" fill="white" opacity="0.12" transform="rotate(-15 52 46)"/>
</svg>
