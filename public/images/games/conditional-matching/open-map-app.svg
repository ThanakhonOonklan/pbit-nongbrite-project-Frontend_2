<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Phone body -->
  <rect x="32" y="10" width="64" height="108" rx="10" fill="#424242"/>
  <rect x="32" y="10" width="64" height="108" rx="10" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="38" y="24" width="52" height="78" rx="4" fill="#E8F5E9"/>
  <!-- Map content on screen -->
  <!-- Roads grid -->
  <line x1="38" y1="50" x2="90" y2="50" stroke="#BDBDBD" stroke-width="1.5"/>
  <line x1="38" y1="70" x2="90" y2="70" stroke="#BDBDBD" stroke-width="1.5"/>
  <line x1="55" y1="24" x2="55" y2="102" stroke="#BDBDBD" stroke-width="1.5"/>
  <line x1="74" y1="24" x2="74" y2="102" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Buildings/blocks -->
  <rect x="42" y="28" width="10" height="18" rx="2" fill="#A5D6A7" opacity="0.6"/>
  <rect x="59" y="28" width="12" height="18" rx="2" fill="#81C784" opacity="0.6"/>
  <rect x="78" y="28" width="8" height="18" rx="2" fill="#A5D6A7" opacity="0.6"/>
  <rect x="42" y="54" width="10" height="12" rx="2" fill="#81C784" opacity="0.5"/>
  <rect x="59" y="54" width="12" height="12" rx="2" fill="#A5D6A7" opacity="0.5"/>
  <rect x="78" y="54" width="8" height="12" rx="2" fill="#81C784" opacity="0.5"/>
  <rect x="42" y="74" width="10" height="16" rx="2" fill="#A5D6A7" opacity="0.6"/>
  <rect x="59" y="74" width="12" height="16" rx="2" fill="#81C784" opacity="0.6"/>
  <rect x="78" y="74" width="8" height="16" rx="2" fill="#A5D6A7" opacity="0.6"/>
  <!-- Route line (blue) -->
  <path d="M64 92 L64 70 L74 70 L74 50 L64 50 L64 36" stroke="#1E88E5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Navigation arrow -->
  <polygon points="64,30 58,40 64,36 70,40" fill="#1E88E5"/>
  <!-- Current location dot -->
  <circle cx="64" cy="92" r="5" fill="#1E88E5" opacity="0.3"/>
  <circle cx="64" cy="92" r="3" fill="#1E88E5"/>
  <circle cx="64" cy="92" r="1.5" fill="white"/>
  <!-- Destination pin -->
  <g transform="translate(64 30)">
    <circle cx="0" cy="-6" r="5" fill="#EF5350"/>
    <circle cx="0" cy="-6" r="2.5" fill="white"/>
    <path d="M0 0 L-3 -4 Q0 2 3 -4 Z" fill="#EF5350"/>
  </g>
  <!-- Speaker notch -->
  <rect x="54" y="14" width="20" height="3" rx="1.5" fill="#333" opacity="0.5"/>
  <!-- Home bar -->
  <rect x="52" y="106" width="24" height="3" rx="1.5" fill="#555" opacity="0.5"/>
  <!-- GPS signal -->
  <path d="M92 18 Q96 14 100 18" stroke="#1E88E5" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M94 14 Q98 8 102 14" stroke="#1E88E5" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
