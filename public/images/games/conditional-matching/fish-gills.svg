<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fish body -->
  <ellipse cx="62" cy="64" rx="42" ry="30" fill="#5B9BD5"/>
  <!-- Tail -->
  <path d="M102 64 L120 44 L120 84 Z" fill="#4A8AC4"/>
  <path d="M102 64 L118 48 L118 80 Z" fill="#5B9BD5"/>
  <!-- Eye -->
  <circle cx="32" cy="54" r="7" fill="white"/>
  <circle cx="32" cy="54" r="4" fill="#2C1810"/>
  <circle cx="33" cy="53" r="1.5" fill="white"/>
  <!-- Mouth -->
  <path d="M20 64 Q16 66 14 64 Q16 62 20 64" fill="#4A7AB0"/>
  <!-- Dorsal fin -->
  <path d="M50 36 Q62 18 76 34" fill="#4A8AC4"/>
  <!-- Bottom fin -->
  <path d="M54 92 Q64 106 74 90" fill="#4A8AC4"/>
  <!-- GILLS AREA - highlighted with red/pink -->
  <path d="M42 46 Q44 64 42 82" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 48 Q50 64 48 80" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 50 Q56 64 54 78" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <!-- Gill area background -->
  <path d="M38 46 Q42 44 56 50 Q58 64 56 78 Q42 84 38 82 Q36 64 38 46" fill="#FF6B6B" opacity="0.2"/>
  <!-- Water bubbles coming from gills -->
  <circle cx="36" cy="48" r="3" fill="#B8E8FF" opacity="0.7"/>
  <circle cx="30" cy="40" r="4" fill="#B8E8FF" opacity="0.6"/>
  <circle cx="24" cy="30" r="3.5" fill="#B8E8FF" opacity="0.5"/>
  <circle cx="38" cy="36" r="2.5" fill="#B8E8FF" opacity="0.5"/>
  <circle cx="18" cy="22" r="3" fill="#B8E8FF" opacity="0.4"/>
  <!-- Arrow pointing to gills -->
  <path d="M14 70 L34 66" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M30 62 L36 66 L30 70" fill="#FF6B6B"/>
  <!-- Body highlight -->
  <ellipse cx="70" cy="54" rx="12" ry="6" fill="white" opacity="0.12"/>
</svg>
