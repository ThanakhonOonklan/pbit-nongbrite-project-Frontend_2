<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><!-- snake-scales -->
  <!-- Fish body -->
  <ellipse cx="58" cy="64" rx="40" ry="28" fill="#4ECDC4"/>
  <!-- Tail -->
  <path d="M96 64 L118 42 L118 86 Z" fill="#3BAFA6"/>
  <path d="M96 64 L116 46 L116 82 Z" fill="#4ECDC4"/>
  <!-- Scales pattern (overlapping rows) -->
  <!-- Row 1 -->
  <path d="M30 50 Q36 44 42 50" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M42 50 Q48 44 54 50" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M54 50 Q60 44 66 50" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M66 50 Q72 44 78 50" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <!-- Row 2 -->
  <path d="M26 58 Q32 52 38 58" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M38 58 Q44 52 50 58" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M50 58 Q56 52 62 58" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M62 58 Q68 52 74 58" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M74 58 Q80 52 86 58" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <!-- Row 3 -->
  <path d="M24 66 Q30 60 36 66" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M36 66 Q42 60 48 66" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M48 66 Q54 60 60 66" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M60 66 Q66 60 72 66" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M72 66 Q78 60 84 66" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <!-- Row 4 -->
  <path d="M26 74 Q32 68 38 74" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M38 74 Q44 68 50 74" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M50 74 Q56 68 62 74" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M62 74 Q68 68 74 74" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M74 74 Q80 68 86 74" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <!-- Row 5 -->
  <path d="M30 82 Q36 76 42 82" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M42 82 Q48 76 54 82" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M54 82 Q60 76 66 82" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <path d="M66 82 Q72 76 78 82" fill="none" stroke="#3BAFA6" stroke-width="2"/>
  <!-- Scale shine highlights -->
  <circle cx="40" cy="54" r="2" fill="white" opacity="0.3"/>
  <circle cx="56" cy="62" r="2" fill="white" opacity="0.3"/>
  <circle cx="48" cy="70" r="2" fill="white" opacity="0.3"/>
  <circle cx="64" cy="54" r="2" fill="white" opacity="0.25"/>
  <!-- Eye -->
  <circle cx="30" cy="56" r="6" fill="white"/>
  <circle cx="30" cy="56" r="3.5" fill="#2C1810"/>
  <circle cx="31" cy="55" r="1.3" fill="white"/>
  <!-- Dorsal fin -->
  <path d="M44 38 Q54 22 68 36" fill="#3BAFA6"/>
  <!-- Bottom fin -->
  <path d="M50 90 Q58 100 68 88" fill="#3BAFA6"/>
  <!-- Magnifying glass overlay to emphasize scales -->
  <circle cx="86" cy="90" r="18" fill="none" stroke="#FFB74D" stroke-width="3"/>
  <line x1="100" y1="104" x2="112" y2="116" stroke="#FFB74D" stroke-width="4" stroke-linecap="round"/>
  <!-- Enlarged scales in magnifier -->
  <circle cx="86" cy="90" r="16" fill="#4ECDC4" opacity="0.4"/>
  <path d="M78 86 Q82 80 86 86" fill="none" stroke="#2A9A92" stroke-width="2.5"/>
  <path d="M86 86 Q90 80 94 86" fill="none" stroke="#2A9A92" stroke-width="2.5"/>
  <path d="M82 94 Q86 88 90 94" fill="none" stroke="#2A9A92" stroke-width="2.5"/>
</svg>
