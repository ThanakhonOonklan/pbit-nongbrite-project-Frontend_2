<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#E8F4F8"/>
  <!-- Grass top -->
  <path d="M 0 40 L 100 40 L 100 100 L 0 100 Z" fill="#84CC16"/>
  <!-- Soil section -->
  <path d="M 0 45 L 100 45 L 100 100 L 0 100 Z" fill="#78350F"/>
  <!-- Worm hole tunnel -->
  <path d="M 30 45 Q 50 95 75 45" stroke="#451A03" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Worm body entering -->
  <path d="M 20 30 Q 30 10 45 25 Q 55 35 48 50" stroke="#F472B6" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Worm segments -->
  <path d="M 20 30 Q 30 10 45 25 Q 55 35 48 50" stroke="#BE185D" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="2 4"/>
  
  <!-- Soil texture -->
  <circle cx="20" cy="70" r="2" fill="#5C2E0A"/>
  <circle cx="80" cy="80" r="1.5" fill="#5C2E0A"/>
  <circle cx="50" cy="90" r="2.5" fill="#5C2E0A"/>
  <circle cx="85" cy="55" r="2" fill="#5C2E0A"/>
  <circle cx="15" cy="85" r="1.5" fill="#5C2E0A"/>
</svg>
