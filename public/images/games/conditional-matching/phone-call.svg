<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Phone body -->
  <rect x="36" y="14" width="56" height="100" rx="10" fill="#42A5F5"/>
  <rect x="36" y="14" width="56" height="100" rx="10" fill="none" stroke="#1E88E5" stroke-width="2"/>
  <!-- Screen -->
  <rect x="42" y="28" width="44" height="68" rx="4" fill="#E3F2FD"/>
  <!-- Screen content - contact -->
  <circle cx="64" cy="50" r="12" fill="#90CAF9"/>
  <circle cx="64" cy="46" r="6" fill="#BBDEFB"/>
  <path d="M52 58 Q58 52 64 52 Q70 52 76 58" fill="#BBDEFB"/>
  <!-- Contact name -->
  <rect x="50" y="66" width="28" height="4" rx="2" fill="#90CAF9"/>
  <!-- Call button -->
  <circle cx="64" cy="82" r="8" fill="#66BB6A"/>
  <path d="M58 80 Q58 76 62 76 L66 76 Q70 76 70 80 L70 82 Q68 86 64 86 Q60 86 58 82 Z" fill="white" transform="rotate(-30 64 82)"/>
  <!-- Home button / bar -->
  <rect x="56" y="100" width="16" height="3" rx="1.5" fill="#1E88E5" opacity="0.5"/>
  <!-- Speaker -->
  <rect x="56" y="19" width="16" height="3" rx="1.5" fill="#1E88E5" opacity="0.5"/>
  <!-- Signal waves -->
  <path d="M90 24 Q96 20 96 28" stroke="#66BB6A" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M94 20 Q102 14 102 32" stroke="#66BB6A" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M98 16 Q108 8 108 36" stroke="#66BB6A" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round"/>
</svg>
