<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Main block background (Ice color) -->
  <rect x="0" y="0" width="64" height="64" rx="6" fill="#7EC8E3" stroke="#428EB8" stroke-width="4"/>

  <!-- Inner glow to make it look like translucent ice -->
  <rect x="4" y="4" width="56" height="56" rx="3" fill="none" stroke="#A8DDEF" stroke-width="3"/>

  <!-- Shiny highlight at top-left corner -->
  <path d="M4 16 Q 4 4 16 4 L 32 4 L 4 32 Z" fill="#D6F0FA" opacity="0.8"/>

  <!-- Horizontal grout lines (forming bricks) -->
  <line x1="0" y1="21" x2="64" y2="21" stroke="#428EB8" stroke-width="3"/>
  <line x1="0" y1="42" x2="64" y2="42" stroke="#428EB8" stroke-width="3"/>

  <!-- Vertical grout lines -->
  <!-- Top row -->
  <line x1="32" y1="0" x2="32" y2="21" stroke="#428EB8" stroke-width="3"/>
  <!-- Middle row (staggered) -->
  <line x1="21" y1="21" x2="21" y2="42" stroke="#428EB8" stroke-width="3"/>
  <line x1="43" y1="21" x2="43" y2="42" stroke="#428EB8" stroke-width="3"/>
  <!-- Bottom row -->
  <line x1="32" y1="42" x2="32" y2="64" stroke="#428EB8" stroke-width="3"/>

  <!-- Brick highlights (top edge of each brick to catch light) -->
  <!-- Top row highlights -->
  <path d="M4 6 L28 6" stroke="#E6F7FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M36 6 L60 6" stroke="#E6F7FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Middle row highlights -->
  <path d="M4 27 L17 27" stroke="#E6F7FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M25 27 L39 27" stroke="#E6F7FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M47 27 L60 27" stroke="#E6F7FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Bottom row highlights -->
  <path d="M4 48 L28 48" stroke="#E6F7FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M36 48 L60 48" stroke="#E6F7FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Sparkles -->
  <circle cx="16" cy="18" r="2" fill="white" opacity="0.9"/>
  <path d="M52 50 L55 54 L52 58 L49 54 Z" fill="white" opacity="0.7"/>
</svg>
